[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gal-trainer"
version = "1.0.0"
description = "Terminal trainer for Geometria e Algebra Lineare (Politecnico di Milano)"
requires-python = ">=3.10"
dependencies = ["rich>=13", "prompt_toolkit>=3", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "sympy>=1.12"]
ingest = ["pypdf>=4"]

[project.scripts]
gal = "gal.cli:main"

[tool.setuptools.packages.find]
include = ["gal*"]

[tool.setuptools.package-data]
"gal.bank" = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
