[[item]]
id = "P2401I2-D1"
ref = "Parte A, domanda 1"
section = "I"
points = 1
topic = "affine"
page = 1
task = "mcq"
text = "In R³ si consideri il piano π passante per A(1, 2, 3), B(2, 1, 2), C(1, 0, 0) e sia r una retta perpendicolare a π. Quale dei seguenti vettori è un vettore direzione di r?"
[item.data]
options = ["(1, 3, 2)", "(1, 3, −2)", "(1, −3, 2)", "(1, −3, −2)"]
correct = "b"
why = "The direction of r is the normal of π: (B − A) × (C − A) = (1, −1, −1) × (0, −2, −3) = (1, 3, −2)."


[[item]]
id = "P2401I2-D2"
ref = "Parte A, domanda 2"
section = "I"
points = 1
topic = "scalar_products"
page = 1
task = "mcq"
text = "In uno spazio euclideo, siano v e w vettori ortogonali tali che ‖v‖ = 2 e ‖w‖ = 3. Allora"
[item.data]
options = ["‖v + 3w‖ = 11", "‖v + 3w‖ = √11", "‖v + 3w‖ = 85", "‖v + 3w‖ = √85"]
correct = "d"
why = "Pythagoras: ‖v + 3w‖² = ‖v‖² + 9‖w‖² = 4 + 81 = 85."


[[item]]
id = "P2401I2-D3"
ref = "Parte A, domanda 3"
section = "I"
points = 1
topic = "rank"
page = 1
task = "mcq"
text = "Siano A ∈ Mat_R(5, 4) e b ∈ R⁵. Sapendo che A ha rango massimo, possiamo affermare che:"
[item.data]
options = ["se det(A|b) = 0, allora il sistema Ax = b ha un'unica soluzione", "se det(A|b) ≠ 0, allora il sistema Ax = b ha un'unica soluzione", "se det(A|b) = 0, allora il sistema Ax = b ha cinque soluzioni", "se det(A|b) ≠ 0, allora il sistema Ax = b ha infinite soluzioni che dipendono da un unico parametro"]
correct = "a"
why = "rg A = 4. det(A|b) = 0 ⇔ rg(A|b) = 4 = rg A = number of unknowns: exactly one solution. det(A|b) ≠ 0 ⇒ rg(A|b) = 5: no solutions."


[[item]]
id = "P2401I2-D4"
ref = "Parte A, domanda 4"
section = "I"
points = 1
topic = "conics"
page = 1
task = "mcq"
text = "Nel piano, l'equazione x² + 4xy + 4y² + 2x + 4y = 0 rappresenta:"
[item.data]
options = ["due rette parallele distinte", "due rette parallele sovrapposte", "due rette reali distinte incidenti", "due rette complesse coniugate"]
correct = "a"
why = "(x + 2y)² + 2(x + 2y) = (x + 2y)(x + 2y + 2) = 0: the parallel lines x + 2y = 0 and x + 2y = −2."


[[item]]
id = "P2401I2-D5"
ref = "Parte A, domanda 5"
section = "I"
points = 1
topic = "rep_matrix"
page = 1
task = "mcq"
text = "Sia C la base canonica di R³ e B = (x², x, 1) una base di R[x]_≤2. La matrice di L: R³ → R[x]_≤2, L(a, b, c) = (a + b)x² + (2b + 2c)x + 3c rispetto alle basi C e B è"
[item.data]
options = ["(2 2 0; 2 0 0; 0 0 3)", "(1 1 0; 0 2 2; 0 0 3)", "(1 0 0; 1 2 0; 0 2 3)", "(2 0 0; 0 4 0; 0 0 3)"]
correct = "b"
why = "Columns = B-coordinates (x², x, 1) of L(e1) = x² → (1, 0, 0), L(e2) = x² + 2x → (1, 2, 0), L(e3) = 2x + 3 → (0, 2, 3)."


[[item]]
id = "P2401I2-D6"
ref = "Parte A, domanda 6"
section = "I"
points = 1
topic = "isometries"
page = 1
task = "mcq"
text = "Nello spazio, l'equazione x² + 2xy + z² + 2x + 2y + 1 = 0 rappresenta:"
[item.data]
options = ["un cilindro a sezione ellittica", "un cilindro a sezione parabolica", "un cono reale", "un cono immaginario"]
correct = "c"
why = "Centre: 2x + 2y + 2 = 0, 2x + 2 = 0, 2z = 0 ⇒ (−1, 0, 0), which lies on the quadric (1 − 2 + 1 = 0): a cone. The quadratic form (1 1 0; 1 0 0; 0 0 1) is indefinite (eigenvalues 1 and (1 ± √5)/2): a real cone."


[[item]]
id = "P2401I2-D7"
ref = "Parte A, domanda 7"
section = "I"
points = 1
topic = "isometries"
page = 1
task = "mcq"
text = "Data una matrice quadrata A a coefficienti reali, possiamo affermare che:"
[item.data]
options = ["se A è ortogonale, allora A è simmetrica", "se det A = ±1, allora A è ortogonale", "Se A è ortogonale, allora A è diagonalizzabile nel campo reale", "Nessuna delle precedenti affermazioni è corretta"]
correct = "d"
why = "A rotation by 90° is orthogonal, not symmetric and not diagonalisable over R; (2 0; 0 1/2) has det 1 but is not orthogonal."


[[item]]
id = "P2401I2-D8"
ref = "Parte A, domanda 8"
section = "I"
points = 1
topic = "determinant"
page = 1
task = "mcq"
text = "Se A ∈ Mat_R(2024, 2024) è invertibile, allora:"
[item.data]
options = ["det[−(A⁻¹)] = −1/det A", "det[−(A⁻¹)] = −det A", "det[−(A⁻¹)] = +det A", "det[−(A⁻¹)] = +1/det A"]
correct = "d"
why = "det(−B) = (−1)ⁿ det B with n = 2024 even, and det(A⁻¹) = 1/det A."


[[item]]
id = "P2401I2-D9"
ref = "Parte A, domanda 9"
section = "I"
points = 1
topic = "diagonalization"
page = 1
task = "mcq"
text = "Siano A, B ∈ Mat_R(n, n), con n ≥ 2. Possiamo affermare che:"
[item.data]
options = ["se A e B hanno stesso determinante e stessa traccia, allora A e B sono sicuramente simili", "se A e B hanno lo stesso polinomio caratteristico, ma una sola delle due matrici è diagonalizzabile, allora sicuramente A e B non sono simili", "se A e B hanno lo stesso polinomio caratteristico ed entrambe non sono diagonalizzabili, allora sicuramente A e B sono simili", "se A e B sono simili ed entrambe non sono diagonalizzabili, allora A e B hanno polinomi caratteristici diversi"]
correct = "b"
why = "Similar matrices are both diagonalisable or both not (B = P⁻¹AP = P⁻¹QDQ⁻¹P). Same det and trace (or same p_A) do not imply similarity; similar matrices always have the same p_A."


[[item]]
id = "P2401I2-D10"
ref = "Parte A, domanda 10"
section = "I"
points = 1
topic = "sum_intersection"
page = 1
task = "mcq"
text = "In R⁴ si considerino U = Span{(1, 0, 0, 0), (1, 1, 0, 0)} e W = Span{(0, 1, 0, 0), (0, 1, 1, 0), (0, 1, 1, 1)}. Allora"
[item.data]
options = ["dim(U ∩ W) = 0", "dim(U ∩ W) = 1", "dim(U ∩ W) = 2", "R⁴ = U + W e U ∩ W = {0}"]
correct = "b"
why = "U = {z = w = 0}, W = {x = 0} (dim 3): U ∩ W = Span(e2), dimension 1 (so the sum R⁴ is not direct)."


[[item]]
id = "P2401I2-D11"
ref = "Parte A, domanda 11"
section = "I"
points = 1
topic = "diagonalization"
page = 1
task = "mcq"
text = "Il polinomio caratteristico dell'endomorfismo L: R³ → R³ è p_L(λ) = −λ³ + 2λ² − λ. Possiamo affermare con certezza che:"
[item.data]
options = ["L è un isomorfismo", "L è diagonalizzabile", "L non è diagonalizzabile", "L ha un autospazio di dimensione 1"]
correct = "d"
why = "p_L = −λ(λ − 1)²: 0 is a simple eigenvalue, so dim V_0 = 1 for sure. L is not invertible; whether mg(1) is 1 or 2 is not determined."


[[item]]
id = "P2401I2-D12"
ref = "Parte A, domanda 12"
section = "I"
points = 1
topic = "linear_maps"
page = 1
task = "mcq"
text = "Sia L_A: R³ → R³, L_A(x) = Ax con A = (1 2 0; 0 1 2; 0 0 1). Allora l'immagine del piano π: x − z = 0 è data da"
[item.data]
options = ["L_A(π) = Span{(1, 0, 0), (2, 1, 0), (0, 2, 1)}", "L_A(π) = Span{(1, 0, 0), (0, 2, 1)}", "L_A(π) = Span{(1, 2, 1), (2, 1, 0)}", "L_A(π) = Span{(1, 2, 1)}"]
correct = "c"
why = "π = Span((1, 0, 1), (0, 1, 0)); A(1, 0, 1) = (1, 2, 1), A(0, 1, 0) = (2, 1, 0) (A is invertible, so the image is a plane)."


