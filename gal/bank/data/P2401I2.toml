[[item]]
id = "P2401I2-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 1
topic = "isometries"
page = 4
task = "open"
setup = "Sia S ∈ Mat_R(3, 3) una matrice invertibile e A = SᵀS."
text = "a) Dimostrare che la matrice A = SᵀS è simmetrica."
[item.data]
solution = """
Aᵀ = (SᵀS)ᵀ = Sᵀ(Sᵀ)ᵀ = SᵀS = A."""


[[item]]
id = "P2401I2-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
text = "b) Determinare la segnatura e la forma canonica di Sylvester della forma quadratica p(x) = xᵀAx, e dimostrare che ⟨x, y⟩ = xᵀAy definisce un prodotto scalare in R³."
[item.data]
solution = """
p(x) = xᵀSᵀSx = (Sx)ᵀ(Sx) = ‖Sx‖² ≥ 0, with equality only if Sx = 0, i.e. x = 0 (S invertible): p is positive definite. Signature (3, 0, 0), Sylvester form y1² + y2² + y3². ⟨x, y⟩ = xᵀAy is bilinear, symmetric (A = Aᵀ) and positive definite: a scalar product."""


[[item]]
id = "P2401I2-E3c"
ref = "Esercizio 3 c)"
section = "II"
points = 1
topic = "isometries"
page = 4
task = "open"
text = "c) Classificare affinemente la quadrica di equazione xᵀAx − 2 = 0."
[item.data]
solution = """
A positive definite, constant −2 < 0: in suitable affine coordinates y1² + y2² + y3² = 1, a real ellipsoid."""
