text = "ii) Si determini per quali a, b ∈ R la matrice M_a,b è invertibile. (Give the value of a for which it is NOT invertible; b plays no role.)"
[item.data]
answers = [["a such that M_a,b is NOT invertible", 0]]
why = "det M_a,b = a·1 − 0·b = a: invertible ⇔ a ≠ 0, for every b."

