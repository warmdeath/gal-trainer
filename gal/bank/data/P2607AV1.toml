[[item]]
id = "P2607AV1-E1iii"
ref = "Esercizio 1 iii)"
section = "II"
points = 1.83
topic = "isometries"
page = 3
task = "open"
text = "iii) Scrivere una base ortonormale di R³ formata da autovettori di A e la matrice diagonale associata in tale base."
[item.data]
solution = """
A is symmetric, so eigenspaces of distinct eigenvalues are orthogonal: normalise one eigenvector for each eigenvalue.
V_−2 = Span((0, 0, 1)), V_0 = Span((1, −1, 0)), V_2 = Span((1, 1, 0)).
B = {(0, 0, 1), (1/√2, −1/√2, 0), (1/√2, 1/√2, 0)} is an orthonormal basis of eigenvectors and
M^B_B(L_A) = D = diag(−2, 0, 2) = PᵀAP, P orthogonal with the vectors of B as columns."""

[[item]]
id = "P2607AV1-E1iv"
ref = "Esercizio 1 iv)"
section = "II"
points = 1.83
topic = "isometries"
page = 3
task = "open"
text = "iv) Determinare la forma canonica metrica della quadrica Q := {x ∈ R³ : xᵀAx = 0}."
[item.data]
solution = """
With the orthogonal change of coordinates x = Py (P from iii): 0 = xᵀAx = yᵀPᵀAPy = yᵀDy.
In the order of iii) this is −2y1² + 0·y2² + 2y3² = 0, i.e. (renaming) 2y1² − 2y2² = 0: two planes through the origin."""

