[[item]]
id = "P2607AV1-E3iv"
ref = "Esercizio 3 iv)"
section = "II"
points = 1.87
topic = "systems"
page = 3
task = "open"
text = "iv) Si determini al variare dei parametri a, b, c, d ∈ R, quante matrici X ∈ M_R(2, 2) soddisfano l'equazione M_a,b · X = M_c,d."
[item.data]
solution = """
M_a,b·X = (ax az; bx + y bz + w) = (c 0; d 1): the linear system ax = c, bx + y = d, az = 0, bz + w = 1 in (x, y, z, w).
• a ≠ 0: the coefficient matrix has rank 4 → exactly one solution (X = M_a,b⁻¹ M_c,d).
• a = 0, c = 0: rank 2 = rank of the complete matrix → infinitely many solutions (∞², x and z free).
• a = 0, c ≠ 0: the equation 0 = c is impossible → no solutions."""
