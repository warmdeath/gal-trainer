[[item]]
id = "F08-E4b"
ref = "Esercizio 4 b)"
topic = "scalar_products"
page = 2
task = "open"
text = """
Per k ∈ R siano v1 = (1, k, 0), v2 = (0, 1, 0). Per quali k: i) v1 ⊥ v2; ii) formano un angolo di π/4; iii) di 2π/3?
Si ripeta con il prodotto scalare di matrice di Gram (1 1 0; 1 2 0; 0 0 3)."""
[item.data]
solution = """
Standard product: ⟨v1,v2⟩ = k, ||v1|| = √(1 + k²), ||v2|| = 1, cos θ = k/√(1 + k²).
 i) k = 0.  ii) k/√(1+k²) = √2/2 ⇔ k > 0 and 2k² = 1 + k² ⇔ k = 1.
 iii) k/√(1+k²) = −1/2 ⇔ k < 0 and 4k² = 1 + k² ⇔ k = −1/√3 = −√3/3.
Gram (1 1 0; 1 2 0; 0 0 3): ⟨v1,v2⟩ = 1 + 2k, ||v2||² = 2, ||v1||² = 1 + 2k + 2k².
 i) k = −1/2.
 ii) (1 + 2k)/√(2(1 + 2k + 2k²)) = √2/2 ⇔ 1 + 2k > 0 and (1 + 2k)² = 1 + 2k + 2k² ⇔ 2k² + 2k = 0 ⇒ k = 0 (k = −1 is rejected: 1 + 2k < 0).
 iii) = −1/2 ⇔ 1 + 2k < 0 and 2(1 + 2k)² = 1 + 2k + 2k² ⇔ 6k² + 6k + 1 = 0 ⇒ k = (−3 − √3)/6 (the other root has 1 + 2k > 0)."""

