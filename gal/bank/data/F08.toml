task = "gram_schmidt"
text = """
Span{(−1, 0, 1), (1, 1, 0), (1, 2, 1)} ◁ R³ con Gram matrix (1 1 0; 1 2 0; 0 0 3).
Note: (1,2,1) = (−1,0,1) + 2·(1,1,0), so W = Span of the first two (Gram-Schmidt would give c3 = 0):
apply Gram-Schmidt to the first two vectors."""
data = { vectors = [[-1, 0, 1], [1, 1, 0]], S = [[1, 1, 0], [1, 2, 0], [0, 0, 3]] }

[[item]]
id = "F08-E6c"
ref = "Esercizio 6 (terza parte)"
topic = "gram_schmidt"
page = 2
task = "open"
text = "Span{(0, 1, 1, 0), (1, 2, 1, 0), (1, −1, 0, √2)} ◁ R⁴ con la struttura euclidea standard: base ortonormale con Gram-Schmidt."
[item.data]
solution = """
c1 = (0, 1, 1, 0), ||c1||² = 2.
c2 = (1,2,1,0) − (3/2)c1 = (1, 1/2, −1/2, 0), ||c2||² = 3/2.
c3 = (1,−1,0,√2) − (−1/2)c1 − (1/(3/2))·... : ⟨b3,c1⟩ = −1, ⟨b3,c2⟩ = 1 − 1/2 = 1/2,
   c3 = b3 + (1/2)c1 − (1/3)c2 = (2/3, −2/3, 2/3, √2), ||c3||² = 4/9·3 + 2 = 10/3.
Orthonormal: d1 = (0, √2/2, √2/2, 0), d2 = (√6/3, √6/6, −√6/6, 0), d3 = (√30/15, −√30/15, √30/15, √15/5)."""

