[[item]]
id = "P2407A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "yesno"
setup = "Data la quadrica Q = {x ∈ R³ : 5x1² + 8x2² + 5x3² + 6x1x3 − 8 = 0}."
text = "a) Stabilire se la quadrica ammette centro."
data = { answer = true, why = "No linear terms and the quadratic part A = (5 0 3; 0 8 0; 3 0 5) has det 128 ≠ 0: the unique centre is the origin." }


[[item]]
id = "P2407A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
text = "b) Classificare metricamente e affinemente Q."
[item.data]
solution = """
Eigenvalues of A: 8 (eigenvectors (1, 0, 1), (0, 1, 0)) and 2 ((1, 0, −1)). Metric form: 8y1² + 8y2² + 2y3² = 8, i.e. y1² + y2² + y3²/4 = 1: an ellipsoid of rotation (semi-axes 1, 1, 2). Affinely: a real ellipsoid."""


[[item]]
id = "P2407A-E3c"
ref = "Esercizio 3 c)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
text = "c) Determinare le equazioni degli assi di simmetria di Q."
[item.data]
solution = """
Through the centre 0 along the eigenvectors: the rotation axis Span((1, 0, −1)) = {x1 + x3 = 0, x2 = 0}; and every line through 0 in the plane V_8 = {x1 − x3 = 0}, e.g. Span((1, 0, 1)) = {x1 − x3 = 0, x2 = 0} and Span((0, 1, 0)) = {x1 = x3 = 0}."""
