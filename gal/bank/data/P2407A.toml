[[item]]
id = "P2407A-E2a"
ref = "Esercizio 2 a)"
section = "II"
points = 2
topic = "rep_matrix"
page = 3
task = "open"
setup = "Per k ∈ R \\ {−2} si considerino gli endomorfismi T_k: R³ → R³ con T_k(x) = 0 se x ∈ π e T_k(x) = 2x se x ∈ Span((1, 1, k)), dove π = {x1 + x2 + x3 = 0}."
text = "a) Determinare M^{E,E}_{T_k}, la matrice rappresentativa di T_k rispetto alla base canonica."
[item.data]
solution = """
Since (1, 1, k) ∉ π (k ≠ −2), R³ = π ⊕ Span(v), v = (1, 1, k). With n = (1, 1, 1): T_k(x) = 2 (⟨n, x⟩/⟨n, v⟩) v, so
M = (2/(k + 2)) · v nᵀ = (2/(k + 2)) (1 1 1; 1 1 1; k k k)."""


[[item]]
id = "P2407A-E2b"
ref = "Esercizio 2 b)"
section = "II"
points = 2
topic = "diagonalization"
page = 3
task = "open"
text = "b) Mostrare che T_k è diagonalizzabile per ogni k ≠ −2."
[item.data]
solution = """
π (dim 2) ⊆ V_0 and Span(v) ⊆ V_2, and π ⊕ Span(v) = R³ because v ∉ π: a basis of eigenvectors exists (eigenvalues 0, 0, 2)."""


