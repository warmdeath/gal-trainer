[[item]]
id = "P2506A-E2c"
ref = "Esercizio 2 c)"
section = "II"
points = 2
topic = "isometries"
page = 3
task = "open"
text = "c) Determinare una matrice ortogonale P e una matrice diagonale D tali che D = PᵀAP."
[item.data]
solution = """
E_1 = {x1 + x2 + x3 = 0} = Span((1, −1, 0), (1, 1, −2)) (orthogonal), E_4 = Span((1, 1, 1)). Normalising:
P = (1/√2 1/√6 1/√3; −1/√2 1/√6 1/√3; 0 −2/√6 1/√3), D = diag(1, 1, 4) = PᵀAP."""


