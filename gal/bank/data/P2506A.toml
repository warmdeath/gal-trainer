[[item]]
id = "P2506A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
setup = "Considerare la quadrica Q = {x ∈ R³ : Q(x) = 4}, dove Q è la forma quadratica dell'esercizio precedente."
text = "a) Classificare Q metricamente. Stabilire se si tratta di una quadrica di rotazione e in caso affermativo trovarne l'asse di rotazione."
[item.data]
solution = """
In the orthonormal eigenbasis: y1² + y2² + 4y3² = 4, i.e. y1²/4 + y2²/4 + y3² = 1: a real ellipsoid. Two equal semi-axes (eigenvalue 1 double): an ellipsoid of rotation, with axis the eigenline E_4 = Span((1, 1, 1)) through the origin."""


[[item]]
id = "P2506A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 2
topic = "conics"
page = 4
task = "open"
text = "b) Classificare metricamente la conica ottenuta intersecando la quadrica Q con il piano {x1 = 0}."
[item.data]
solution = """
x1 = 0: 2x2² + 2x2x3 + 2x3² = 4, i.e. x2² + x2x3 + x3² = 2, matrix (1 1/2; 1/2 1) with eigenvalues 3/2, 1/2: (3/2)u² + (1/2)v² = 2, i.e. u²/(4/3) + v²/4 = 1, a real ellipse."""
