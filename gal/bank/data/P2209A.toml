[[item]]
id = "P2209A-E3a"
ref = "Esercizio 3.1"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
setup = "Sia Q ⊆ R³ la quadrica x² + y² + 2z² + 2xy − 6x − 6y − 6z + 11 = 0."
text = "1. Classificare Q metricamente."
[item.data]
solution = """
A = (1 1 0; 1 1 0; 0 0 2): eigenvalues 2 ((1, 1, 0) and (0, 0, 1)) and 0 ((1, −1, 0)). The linear part (−3, −3, −3) is orthogonal to (1, −1, 0): there is a line of centres (3, 0, 3/2) + τ(−1, 1, 0), where the constant is −5/2. Metric form 2X² + 2Y² = 5/2, i.e. X² + Y² = 5/4: a circular cylinder."""


