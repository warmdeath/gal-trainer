page = 2
task = "values"
text = "3. Stabilire per quali valori di t ∈ R il vettore v_t = (1, 1, t, 2t) appartiene ad U."
data = { answers = [["t", "2/3"]], why = "v_t = a(1, 1, 2, 0) + b(1, 1, 1, 1): a + b = 1, 2a + b = t, b = 2t ⇒ a = 1 − 2t, 2 − 4t + 2t = t ⇒ t = 2/3." }


[[item]]
id = "P2209A-E1d"
ref = "Esercizio 1.4"
section = "II"
points = 2
topic = "projections"
page = 2
task = "open"
text = "4. Determinare la proiezione ortogonale di v_t su U al variare di t ∈ R. Per quali valori di t la proiezione coincide con v_t?"
[item.data]
solution = """
With the projection matrix of U: π_U(v_t) = (3t/4 + 1/2, 3t/4 + 1/2, t/4 + 1/2, 5t/4 + 1/2). It equals v_t exactly when v_t ∈ U, i.e. for t = 2/3."""


