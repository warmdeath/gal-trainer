# ---------------------------------------------------------------- Esercizio 10
[[item]]
id = "F07-E10A"
ref = "Esercizio 10 (A)"
topic = "diagonalization"
page = 3
task = "open"
text = "Per quali k ∈ R A = (1 k; 2 −1) è diagonalizzabile (su R, e su C)?"
[item.data]
solution = """
p_A(t) = t² − (1 + 2k). Over R: if 1 + 2k > 0 two distinct real eigenvalues ±√(1 + 2k) ⇒ diagonalisable;
if 1 + 2k < 0 no real eigenvalues ⇒ not diagonalisable over R; if k = −1/2, p = t² but A ≠ O ⇒ not diagonalisable.
So over R: diagonalisable ⇔ k > −1/2.  Over C: diagonalisable ⇔ k ≠ −1/2 (distinct roots ±√(1 + 2k))."""

