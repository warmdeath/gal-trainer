# ---------------------------------------------------------------- Esercizio 3
[[item]]
id = "F07-E3ai"
ref = "Esercizio 3 a) i)"
topic = "eigen"
page = 1
task = "open"
text = "Per k ∈ R sia A_k = (1 −1; 1 k). Per quali k la matrice A_k ha autovalori (reali)?"
[item.data]
solution = """
p(t) = t² − (1 + k)t + (k + 1). Real roots ⇔ discriminant ≥ 0:
(1 + k)² − 4(k + 1) = (k + 1)(k − 3) ≥ 0 ⇔ k ≤ −1 or k ≥ 3."""

[[item]]
id = "F07-E3a"
ref = "Esercizio 3 a) ii) iii)"
topic = "eigen"
page = 1
task = "values"
text = "A_k = (1 −1; 1 k). ii) Per quale k λ = 3 è un autovalore di A_k? iii) Per quale k v = (4, −1)ᵀ è un autovettore di A_k?"
[item.data]
answers = [["k such that 3 is an eigenvalue", "7/2"], ["k such that (4,−1) is an eigenvector", "21/4"]]
why = "ii) p(3) = 9 − 3(1 + k) + k + 1 = 7 − 2k = 0 ⇔ k = 7/2.  iii) A_k v = (5, 4 − k) must be a multiple of (4, −1): μ = 5/4 and 4 − k = −5/4 ⇔ k = 21/4."

[[item]]
id = "F07-E3bi"
ref = "Esercizio 3 b) i)"
topic = "eigen"
page = 1
task = "values"
text = "Per s ∈ R sia B_s = (s 1 0; 1 3 1; 0 1 s). Per quali s −3 è un autovalore di B_s?"
[item.data]
answers = [["values of s", ["-3", "-8/3"]]]
why = "det(−3I − B_s) = (−3 − s)[(−6)(−3 − s) − 1] − (−1)(−1)(−3 − s)·... = −(s + 3)(3s + 8) = 0 ⇔ s ∈ {−3, −8/3}."

[[item]]
id = "F07-E3bii"
ref = "Esercizio 3 b) ii)"
topic = "eigen"
page = 1
task = "yesno"
text = "B_s = (s 1 0; 1 3 1; 0 1 s). È w = (1, 0, −1)ᵀ un autovettore di B_s per ogni s ∈ R?"
data = { answer = true, why = "B_s w = (s, 1 − 1, −s) = s·w: w is an eigenvector with eigenvalue s, for every s." }

