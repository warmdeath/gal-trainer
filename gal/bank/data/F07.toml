[[item]]
id = "F07-E7bc"
ref = "Esercizio 7 b) c)"
topic = "diagonalization"
page = 2
task = "values"
text = """
A = (2 0 2; 0 2 0; 0 0 0), C = diag(2, t, 2), D = (2 0 1; 0 t 0; 0 0 2).
b) Per quali t ∈ R A e C sono simili?  c) Per quali t ∈ R A e D sono simili?"""
[item.data]
answers = [["values of t with A ~ C", ["0"]], ["values of t with A ~ D ('none' if never)", []]]
why = """A is diagonalisable (mg(2) = 3 − rg(A − 2I) = 2 = ma(2)), so A ~ diag(2, 2, 0).
b) C is diagonal: C ~ A ⇔ same eigenvalues with multiplicity ⇔ t = 0.
c) Same p forces t = 0, but then D − 2I = (0 0 1; 0 −2 0; 0 0 0) has rank 2, mg(2) = 1: D is not
diagonalisable while A is ⇒ never similar."""

