# ---------------------------------------------------------------- Esercizio 13
[[item]]
id = "F07-E13"
ref = "Esercizio 13"
topic = "eigen"
page = 3
task = "open"
text = """
Dimostrare o confutare:
a) M1 := {X ∈ M_R(2) | 0 è un autovalore di X} è un sottospazio vettoriale di M_R(2).
b) M2 := {X ∈ M_R(2) | v = (1, 2)ᵀ è un autovettore di X} è un sottospazio vettoriale di M_R(2)."""
[item.data]
solution = """
a) FALSE. 0 is an eigenvalue ⇔ det X = 0. E11 = (1 0; 0 0) and E22 = (0 0; 0 1) are in M1, but E11 + E22 = I is not.
b) TRUE (if we read it as {X : Xv ∈ Span(v)}, which also contains O): Xv = λv and Yv = μv give (X + Y)v = (λ + μ)v
   and (cX)v = (cλ)v. Equivalently it is the kernel of the linear map X ↦ (second coordinate of Xv) − 2·(first),
   one linear condition, so dim M2 = 3."""

