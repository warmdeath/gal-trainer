[[item]]
id = "F07-E10D"
ref = "Esercizio 10 (D)"
topic = "diagonalization"
page = 3
task = "open"
text = "Per quali k ∈ R D = (k + 2  k; −k  k − 2) è diagonalizzabile (su R, e su C)?"
[item.data]
solution = """
p_D(t) = t² − 2k t + (k² − 4 + k²) = t² − 2kt + 2k² − 4, discriminant/4 = k² − (2k² − 4) = 4 − k².
|k| < 2: two distinct real eigenvalues k ± √(4 − k²) ⇒ diagonalisable over R.
|k| > 2: complex eigenvalues ⇒ not over R (but diagonalisable over C).
k = ±2: double eigenvalue λ = k; D − kI = (2 k; −k −2) ≠ O ⇒ mg = 1 ⇒ not diagonalisable (neither over C).
So over R: −2 < k < 2;  over C: k ≠ ±2."""

