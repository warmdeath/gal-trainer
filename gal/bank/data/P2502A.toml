[[item]]
id = "P2502A-E3d"
ref = "Esercizio 3 d)"
section = "II"
points = 1
topic = "isometries"
page = 4
task = "open"
text = "d) Verificare che l'endomorfismo L: V → V definito da L(a + bx) = 3a + 2b − bx è simmetrico rispetto a questo prodotto scalare."
[item.data]
solution = """
In the basis {1, x}: M = M(L) = (3 2; 0 −1) and G = (2 1; 1 1). L is symmetric ⇔ ⟨L(p), q⟩ = ⟨p, L(q)⟩ ⇔ MᵀG = GM. GM = (6 3; 3 1) is symmetric, so MᵀG = (GM)ᵀ = GM: L is symmetric. (Equivalently, check ⟨L(1), x⟩ = ⟨1, L(x)⟩: L(1) = 3, L(x) = 2 − x, ⟨3, x⟩ = 3 = ⟨1, 2 − x⟩.)"""
