[[item]]
id = "P2502A-D1"
ref = "Parte A, domanda 1"
section = "I"
points = 1
topic = "rank"
page = 1
task = "mcq"
text = "Siano A ∈ Mat(n, n) e b ∈ Rⁿ."
[item.data]
options = ["Se A è invertibile allora bA⁻¹ è una soluzione del sistema", "Se il sistema ammette infinite soluzioni, allora det(A) ≠ 0", "Se il sistema ammette soluzioni allora A è invertibile", "Se A è invertibile allora il sistema Ax = b ammette un'unica soluzione"]
correct = "d"
why = "A invertible ⇒ x = A⁻¹b is the unique solution (bA⁻¹ is not even defined for a column b). Infinitely many solutions force det A = 0; solvable does not imply invertible."


[[item]]
id = "P2502A-D2"
ref = "Parte A, domanda 2"
section = "I"
points = 1
topic = "systems"
page = 1
task = "mcq"
text = "Quanti polinomi p(t) ∈ R[t]_2 esistono tali che p(1) = 3, p(2) = 5, p(3) = 7?"
[item.data]
options = ["infiniti", "nessuno", "uno", "tre"]
correct = "c"
why = "p(t) = a + bt + ct²: 3 conditions, a Vandermonde system with nonzero determinant (distinct nodes) → exactly one, p(t) = 2t + 1."


[[item]]
id = "P2502A-D3"
ref = "Parte A, domanda 3"
section = "I"
points = 1
topic = "sum_intersection"
page = 1
task = "mcq"
text = "Siano H, K ⊆ R¹⁰ due sottospazi vettoriali, con dim H = dim K = 5."
[item.data]
options = ["dim(H ∩ K) > 0", "H = K", "dim(H + K) < 10", "Se dim(H ∩ K) = {0} allora H + K = R¹⁰"]
correct = "d"
why = "Grassmann: dim(H + K) = 10 − dim(H ∩ K). If H ∩ K = {0} then dim(H + K) = 10, so H + K = R¹⁰. The intersection can be {0}, so A and C are not forced."


[[item]]
id = "P2502A-D4"
ref = "Parte A, domanda 4"
section = "I"
points = 1
topic = "diagonalization"
page = 1
task = "mcq"
text = "Siano A, B ∈ Mat(2, 2)."
[item.data]
options = ["Se A, B sono simili, allora A, B hanno lo stesso polinomio caratteristico", "Se A, B hanno lo stesso polinomio caratteristico, allora A, B sono simili", "Se A, B hanno lo stesso rango, allora A, B sono simili", "Se A, B sono simili, allora sono invertibili"]
correct = "a"
why = "B = P⁻¹AP ⇒ det(tI − B) = det(tI − A). The converse fails: (1 1; 0 1) and I have the same p_A but are not similar."


[[item]]
id = "P2502A-D5"
ref = "Parte A, domanda 5"
section = "I"
points = 1
topic = "rank"
page = 1
task = "mcq"
text = "Sia A ∈ Mat(n, n), e sia A′ una sua riduzione a scala. Allora"
[item.data]
options = ["det(A) = det(A′)", "rk(A) = rk(A′)", "tr(A) = tr(A′)", "χ_A(x) = χ_A′(x)"]
correct = "b"
why = "Elementary row operations preserve the rank; they can change det (swaps, scalings), trace and characteristic polynomial."


[[item]]
id = "P2502A-D6"
ref = "Parte A, domanda 6"
section = "I"
points = 1
topic = "rank"
page = 1
task = "mcq"
text = "Siano A, B ∈ Mat(n, n). Allora"
[item.data]
options = ["col(AB) ⊆ col(A)", "col(AB) ⊆ col(B)", "col(A) ⊆ col(AB)", "col(B) ⊆ col(AB)"]
correct = "a"
why = "Every column of AB is A times a column of B, i.e. a combination of the columns of A."


[[item]]
id = "P2502A-D7"
ref = "Parte A, domanda 7"
section = "I"
points = 1
topic = "linear_maps"
page = 1
task = "mcq"
text = "Sia L: V → W un'applicazione lineare, e v1, ..., vn ∈ V dei vettori."
[item.data]
options = ["Se L è suriettiva e v1, ..., vn sono linearmente indipendenti, allora L(v1), ..., L(vn) sono linearmente indipendenti", "Se v1, ..., vn sono generatori di V, allora L(v1), ..., L(vn) sono generatori di W", "Se L è iniettiva e v1, ..., vn sono linearmente indipendenti, allora L(v1), ..., L(vn) sono linearmente indipendenti", "Se L(v1), ..., L(vn) sono generatori di W, allora v1, ..., vn sono generatori di V"]
correct = "c"
why = "Σ ai L(vi) = 0 ⇒ L(Σ ai vi) = 0 ⇒ (injective) Σ ai vi = 0 ⇒ all ai = 0. Generators of V only generate Im L."


[[item]]
id = "P2502A-D8"
ref = "Parte A, domanda 8"
section = "I"
points = 1
topic = "scalar_products"
page = 1
task = "mcq"
text = "Si consideri Rⁿ con un prodotto scalare. Allora"
[item.data]
options = ["La funzione p: Rⁿ → R definita da p(v) = ‖v‖ è una forma quadratica", "La funzione L: Rⁿ → R definita da L(v) = ‖v‖² è un'applicazione lineare", "La funzione p: Rⁿ → R definita da p(v) = ‖v‖² è una forma quadratica", "La funzione L: Rⁿ → R definita da L(v) = ‖v‖ è un'applicazione lineare"]
correct = "c"
why = "‖v‖² = ⟨v, v⟩ is the quadratic form of the scalar product. ‖v‖ is not quadratic (‖2v‖ = 2‖v‖ ≠ 4‖v‖) and neither is linear."


[[item]]
id = "P2502A-D9"
ref = "Parte A, domanda 9"
section = "I"
points = 1
topic = "bases"
page = 1
task = "mcq"
text = "In R² considerare la base {(1, 1), (0, 1)}, allora il vettore delle coordinate di (3, 1) è"
[item.data]
options = ["(3, −2)", "(3, 1)", "(3, −4)", "(2, 1)"]
correct = "a"
why = "a(1, 1) + b(0, 1) = (3, 1) ⇔ a = 3, a + b = 1 ⇔ (a, b) = (3, −2)."


[[item]]
id = "P2502A-D10"
ref = "Parte A, domanda 10"
section = "I"
points = 1
topic = "rep_matrix"
page = 1
task = "mcq"
text = "Sia L: V → V un endomorfismo e siano B e C due basi di V. Allora"
[item.data]
options = ["M_L^{B,B} e M_L^{C,C} sono congruenti", "M_L^{B,B} e M_L^{C,C} sono simili", "M_L^{B,C} e M_L^{C,B} sono simili", "nessuna delle precedenti"]
correct = "b"
why = "M_L^{C,C} = P⁻¹ M_L^{B,B} P with P the change-of-basis matrix: similar (congruent would need Pᵀ, and only for orthonormal changes the two agree)."


[[item]]
id = "P2502A-D11"
ref = "Parte A, domanda 11"
section = "I"
points = 1
topic = "inverse"
page = 1
task = "mcq"
text = "La matrice (2 1; 3 5)"
[item.data]
options = ["è invertibile con inversa (5/7 −1/7; −3/7 2/7)", "è invertibile con inversa (5 −1; −3 2)", "è invertibile con inversa (−5/2 1/2; 3/2 −1)", "non è invertibile"]
correct = "a"
why = "det = 10 − 3 = 7: the inverse is (1/7)(5 −1; −3 2)."


[[item]]
id = "P2502A-D12"
ref = "Parte A, domanda 12"
section = "I"
points = 1
topic = "diagonalization"
page = 1
task = "mcq"
text = "Sia A ∈ Mat(3, 3) una matrice diagonalizzabile tale che χ_A(t) = t²(2 − t). Allora"
[item.data]
options = ["A è invertibile", "dim(E_0) = 2", "A è ortogonalmente diagonalizzabile", "esiste una base ortonormale di R³ composta da autovettori di A"]
correct = "b"
why = "0 is an eigenvalue with ma = 2 and A is diagonalisable, so mg(0) = dim E_0 = 2 (and A is not invertible). Orthogonal diagonalisability needs A symmetric."


