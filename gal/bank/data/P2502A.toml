solution = """
Yes: they represent the same endomorphism in two bases, M^B_B(T) = P⁻¹ M^E_E(T) P with P = M^B_E(id) = (1 1 1; 2 1 1; 0 1 0), the matrix whose columns are the vectors of B."""


