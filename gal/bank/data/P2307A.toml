[[item]]
id = "P2307A-E1c"
ref = "Esercizio 1 c)"
section = "II"
points = 3
topic = "isometries"
page = 2
task = "open"
text = "c) Trovare i valori di k per cui L_k è simmetrica e per tali valori determinare una base ortogonale di R³ formata da autovettori di L_k."
[item.data]
solution = """
A_k is symmetric ⇔ a12 = a21 ⇔ 0 = k: k = 0. A_0 = (1 0 3; 0 0 0; 3 0 −1): eigenvalue 0 on e2 = (0, 1, 0); on the (x, z) plane the block (1 3; 3 −1) has eigenvalues ±√10, with eigenvectors (3, 0, √10 − 1) and (3, 0, −√10 − 1). These three vectors are an orthogonal basis of eigenvectors."""


