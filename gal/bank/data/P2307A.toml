setup = "Data la conica C ⊆ R²: 2x² + 4xy + 5y² + 2x − 2y + 1 = 0."
text = "a) Trovarne l'eventuale centro."
data = { answers = [["x of the centre", "-7/6"], ["y of the centre", "2/3"]], why = "Centre: Ac = −b with A = (2 2; 2 5), b = (1, −1): c = (−7/6, 2/3) (det A = 6 ≠ 0, unique)." }


[[item]]
id = "P2307A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 4
topic = "conics"
page = 4
task = "open"
text = "b) Trovare gli assi di simmetria e classificare affinemente e metricamente la conica C."
[item.data]
solution = """
Eigenvalues 1 ((2, −1)) and 6 ((1, 2)); at the centre c = (−7/6, 2/3) the constant becomes bᵀc + 1 = −5/6. Metric form X² + 6Y² = 5/6, i.e. X²/(5/6) + Y²/(5/36) = 1: a real ellipse (affinely: an ellipse). Axes: c + t(2, −1) and c + t(1, 2), i.e. x + 2y = 1/6 and 2x − y = −3."""
