[[item]]
id = "P2206A-E1c"
ref = "Esercizio 1 c)"
section = "II"
points = 1
topic = "vector_spaces"
page = 2
task = "open"
text = "c) Verificare che U = {p(x) ∈ R_≤2[x] : p(1) = 0} è un sottospazio di R_≤2[x]."
[item.data]
solution = """
U = ker of the linear map p ↦ p(1): 0 ∈ U and (αp + βq)(1) = αp(1) + βq(1) = 0 for p, q ∈ U."""


