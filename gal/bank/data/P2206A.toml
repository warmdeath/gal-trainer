[[item]]
id = "P2206A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
setup = "Nello spazio R³ si consideri la quadrica Ω: x² + y² + z² − xy − xz − yz − 1 = 0."
text = "a) Fornire la classificazione metrica della quadrica."
[item.data]
solution = """
A = (1 −1/2 −1/2; −1/2 1 −1/2; −1/2 −1/2 1): eigenvalues 0 ((1, 1, 1)) and 3/2 (double). No linear terms: (3/2)(X² + Y²) = 1, i.e. X² + Y² = 2/3: a circular cylinder with axis Span((1, 1, 1))."""


[[item]]
id = "P2206A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 3
topic = "conics"
page = 4
task = "open"
text = "b) Dimostrare che la conica tagliata da Ω sul piano xy ha centro di simmetria, e scriverne una forma canonica."
[item.data]
solution = """
z = 0: x² − xy + y² = 1. Matrix (1 −1/2; −1/2 1), det 3/4 ≠ 0 and no linear terms: centre (0, 0). Eigenvalues 1/2 and 3/2: X²/2 + 3Y²/2 = 1, i.e. X²/2 + Y²/(2/3) = 1, a real ellipse."""
