[[item]]
id = "P2309A-E2a"
ref = "Esercizio 2 a)"
section = "II"
points = 2
topic = "diagonalization"
page = 3
task = "yesno"
setup = "Si considerino A = (2 0 0; 0 2 0; 4 0 −2) e B = (0 0 2; 0 2 0; 2 0 0)."
text = "a) Stabilire se le due matrici sono simili."
data = { answer = true, why = "Both have eigenvalues 2, 2, −2 and are diagonalisable: mg_A(2) = 3 − rg(A − 2I) = 2, and B is symmetric. Both are similar to diag(2, 2, −2)." }


[[item]]
id = "P2309A-E2b"
ref = "Esercizio 2 b)"
section = "II"
points = 3
topic = "isometries"
page = 3
task = "open"
text = "b) Stabilire se A o B sono ortogonalmente diagonalizzabili e, nel caso, determinarne una base di autovettori ortonormali."
[item.data]
solution = """
A is not symmetric, so it is not orthogonally diagonalisable. B is symmetric: orthonormal eigenbasis e2 = (0, 1, 0) and (1, 0, 1)/√2 (eigenvalue 2), (1, 0, −1)/√2 (eigenvalue −2)."""


[[item]]
id = "P2309A-E2c"
ref = "Esercizio 2 c)"
section = "II"
points = 2
topic = "isometries"
page = 3
task = "open"
text = "c) Sia v = (1, 0, 1)ᵀ. Dimostrare che x ⊥ v se e solo se Bx ⊥ v. Determinare x ∈ R³ con ⟨x, v⟩ = 0 ma ⟨Ax, v⟩ ≠ 0."
[item.data]
solution = """
B is symmetric and Bv = 2v: ⟨Bx, v⟩ = ⟨x, Bv⟩ = 2⟨x, v⟩, so one vanishes iff the other does. For A: ⟨Ax, v⟩ = ⟨x, Aᵀv⟩ with Aᵀv = (6, 0, −2); x = (1, 0, −1) gives ⟨x, v⟩ = 0 but ⟨Ax, v⟩ = 8 ≠ 0."""


[[item]]
id = "P2309A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 4
topic = "isometries"
page = 4
task = "open"
setup = "Data la quadrica Q ⊆ R³: −2x² + 2y² − z² + 4xy + 2y + 2z − 1 = 0."
text = "a) Classificare affinemente e metricamente Q."
[item.data]
solution = """
Quadratic part (−2 2 0; 2 2 0; 0 0 −1): eigenvalues 2√2, −2√2, −1 (det = 8 ≠ 0): a centre, c = (−1/4, −1/4, 1), where the constant becomes −1/4. Metric form 2√2X² − 2√2Y² − Z² = 1/4: one positive and two negative coefficients, a hyperboloid of two sheets (affinely too)."""


[[item]]
id = "P2309A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
text = "b) Determinare le equazioni (cartesiane o parametriche) degli assi di simmetria di Q."
[item.data]
solution = """
The lines through the centre (−1/4, −1/4, 1) along the eigenvectors: (√2 − 1, 1, 0) (λ = 2√2), (−√2 − 1, 1, 0) (λ = −2√2) and (0, 0, 1) (λ = −1)."""
