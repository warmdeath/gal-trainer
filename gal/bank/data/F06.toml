# ---------------------------------------------------------------- Esercizio 1
[[item]]
id = "F06-E1a"
ref = "Esercizio 1 a)"
topic = "rep_matrix"
page = 1
task = "yesno"
text = "Esiste una mappa lineare f: R³ → R³ con f(4,1,0) = (1,0,1), f(0,0,1) = (1,1,2), f(4,1,1) = (1,−1,0)?"
data = { answer = false, why = "(4,1,1) = (4,1,0) + (0,0,1), so linearity forces f(4,1,1) = (1,0,1) + (1,1,2) = (2,1,3) ≠ (1,−1,0)." }

[[item]]
id = "F06-E1b"
ref = "Esercizio 1 b)"
topic = "rep_matrix"
page = 1
task = "yesno"
text = "Esiste un'unica mappa lineare L: R³ → R³ con L(4,1,0) = (1,0,1), L(0,0,1) = (1,1,2), L(3,1,0) = (1,−1,0)?"
data = { answer = true, why = "(4,1,0), (0,0,1), (3,1,0) are a basis of R³ (det = −1 ≠ 0): by the Teorema di interpolazione there is exactly one such L." }

[[item]]
id = "F06-E1c"
ref = "Esercizio 1 c)"
topic = "rep_matrix"
page = 1
task = "interp_matrix"
text = "Scrivere la matrice di trasformazione M^E_E(L) della mappa del punto b)."
data = { basis = [[4, 1, 0], [0, 0, 1], [3, 1, 0]], images = [[1, 0, 1], [1, 1, 2], [1, -1, 0]], ask = ["E_E"] }

