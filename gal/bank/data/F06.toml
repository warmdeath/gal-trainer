text = """
Per quali k ∈ R la mappa L dell'esercizio 6 è iniettiva? suriettiva? un isomorfismo?
(dim R[t]≤3 = dim R⁴ = 4, so injective ⇔ surjective ⇔ isomorphism ⇔ det M^C_E(L) ≠ 0.)"""
data = { param = "k", A = [[1, "k", 0, 1], [0, 0, 0, 1], ["k", 0, 1, 0], [1, 1, 0, 0]], name = "M^C_E(L)" }

