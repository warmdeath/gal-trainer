# ---------------------------------------------------------------- Esercizio 4 (tema d'esame)
[[item]]
id = "F06-E4a"
exam = "08/02/2026"
ref = "Esercizio 4 a)"
topic = "bases"
page = 2
task = "coords"
text = """
[Dal tema d'esame del 08/02/2026] V = M_R(2) con base canonica B = {B1, B2, B3, B4}, W = Span(B1, B2, B3).
a) Si verifichi che C := {B1 + B2, B2 + B3, B3 − B2} è una base di W.
(Coordinates w.r.t. {B1, B2, B3}; as v take B1 + B2 + B3 and also give its C-coordinates.)"""
data = { basis = [[1, 1, 0], [0, 1, 1], [0, -1, 1]], v = [1, 1, 1], labels = ["B1 + B2", "B2 + B3", "B3 − B2"], vlabel = "B1 + B2 + B3", coords_note = "coordinates w.r.t. {B1, B2, B3} of W" }

[[item]]
id = "F06-E4b"
exam = "08/02/2026"
ref = "Esercizio 4 b)"
topic = "linear_maps"
page = 2
task = "open"
text = "Si verifichi che f: W → V, f(X) = AX + XᵀA con A := (1 2; −2 3) è un'applicazione lineare."
[item.data]
solution = """
f(λX + μY) = A(λX + μY) + (λX + μY)ᵀA = λ(AX + XᵀA) + μ(AY + YᵀA) = λf(X) + μf(Y),
using distributivity of the product and linearity of the transpose ((λX + μY)ᵀ = λXᵀ + μYᵀ)."""

[[item]]
id = "F06-E4c"
