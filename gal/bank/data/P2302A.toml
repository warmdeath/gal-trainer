[[item]]
id = "P2302A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 4
topic = "isometries"
page = 4
task = "open"
setup = "Si consideri la quadrica Q ⊆ R³ di equazione x1² + x2² + x3² + 6x1x3 − 16x1 + 4x2 = 0."
text = "a) Trovare una forma canonica metrica e classificare Q."
[item.data]
solution = """
A = (1 0 3; 0 1 0; 3 0 1): eigenvalues 4 ((1, 0, 1)), −2 ((1, 0, −1)), 1 ((0, 1, 0)). Centre: Ac = (8, −2, 0) ⇒ c = (−1, −2, 3), and the constant becomes bᵀc = 4 (b = (−8, 2, 0)). In the eigen-coordinates: 4X² − 2Y² + Z² + 4 = 0, i.e. Y²/2 − X² − Z²/4 = 1: a hyperboloid of two sheets."""


[[item]]
id = "P2302A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
text = "b) Scrivere esplicitamente l'isometria di R³ che trasforma l'equazione di Q nella forma canonica metrica trovata."
[item.data]
solution = """
x1 = (X + Y)/√2 − 1,  x2 = Z − 2,  x3 = (X − Y)/√2 + 3 (rotation with columns (1, 0, 1)/√2, (1, 0, −1)/√2, (0, 1, 0), then translation to the centre (−1, −2, 3)). Substituting gives 4X² − 2Y² + Z² + 4 = 0."""
