[[item]]
id = "P2301I2-D11"
ref = "Parte A, domanda 11"
section = "I"
points = 1
topic = "determinant"
page = 1
task = "mcq"
text = "Date due matrici A, B ∈ Mat_R(3, 3), quale delle seguenti affermazioni è vera?"
[item.data]
options = ["det(A²) = (det(A))²", "det(A + B) = det(A) + det(B)", "det(5A) = 5 det(A)", "rk(AB) = rk(A) + rk(B)"]
correct = "a"
why = "Binet: det(A·A) = det(A)². det(5A) = 125 det A; det is not additive; rk(AB) ≤ min(rk A, rk B)."


[[item]]
id = "P2301I2-D12"
ref = "Parte A, domanda 12"
section = "I"
points = 1
topic = "conics"
page = 1
task = "mcq"
text = "La conica di equazione x² + 4xy + y² + 2x + 2y + 1 = 0 è"
[item.data]
options = ["un'iperbole di centro (1/3, 1/3)", "un'iperbole di centro (−1/3, −1/3)", "una coppia di rette incidenti in (−1/3, −1/3)", "una coppia di rette incidenti in (1/3, 1/3)"]
correct = "b"
why = "det(1 2; 2 1) = −3 < 0 (hyperbolic type); the complete matrix (1 2 1; 2 1 1; 1 1 1) has det −1 ≠ 0 (non-degenerate). Centre: (1 2; 2 1)c = −(1, 1) ⇒ c = (−1/3, −1/3)."


