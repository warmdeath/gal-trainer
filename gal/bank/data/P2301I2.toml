topic = "diagonalization"
page = 3
task = "open"
text = "c) Determinare se A e C sono simili, ed in tal caso trovare una matrice invertibile S per cui A = S⁻¹CS."
[item.data]
solution = """
Both are similar to D = diag(2, 3): P_A⁻¹AP_A = D with P_A = (2 1; −1 −1), P_C⁻¹CP_C = D with P_C = (0 1; 1 1). Then A = P_A P_C⁻¹ C P_C P_A⁻¹ = S⁻¹CS with S = P_C P_A⁻¹ = (−1 −2; 0 −1)."""


[[item]]
id = "P2301I2-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
setup = "Dato v = (1, 1, 1), si consideri il luogo Q = {x ∈ R³ | cos(v̂x) = ±1/√2} ∪ {0}."
text = "a) Dimostrare che Q è una quadrica di equazione x² + y² + z² − 4xy − 4xz − 4yz = 0."
[item.data]
solution = """
cos² = ⟨v, x⟩²/(‖v‖²‖x‖²) = 1/2 ⇔ 2(x + y + z)² = 3(x² + y² + z²) ⇔ x² + y² + z² − 4xy − 4xz − 4yz = 0 (this also contains 0)."""


[[item]]
id = "P2301I2-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
text = "b) Trovare la forma canonica metrica e classificare la quadrica Q."
[item.data]
solution = """
Matrix (1 −2 −2; −2 1 −2; −2 −2 1): eigenvalue −3 on (1, 1, 1), eigenvalue 3 (double) on its orthogonal plane. Canonical form 3X² + 3Y² − 3Z² = 0, i.e. X² + Y² − Z² = 0: a real (circular) cone with vertex 0."""


