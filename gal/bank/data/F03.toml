# ---------------------------------------------------------------- Esercizio 6
[[item]]
id = "F03-E6"
ref = "Esercizio 6"
topic = "vector_spaces"
page = 2
task = "open"
text = """
a) Data S = (0 1; 1 0) ∈ M_R(2), si dimostri che U := {A ∈ M_R(2) | SAS = A} è un sottospazio di M_R(2).
b) Si spieghi perché W := {A ∈ M_R(2) | A² − A = O} non è un sottospazio di M_R(2)."""
[item.data]
solution = """
a) S1: S·O·S = O. S2: if SAS = A and SBS = B then S(A+B)S = SAS + SBS = A + B. S3: S(λA)S = λSAS = λA.
   (Equivalently U = ker of the linear map A ↦ SAS − A.) Explicitly SAS swaps both rows and columns,
   so U = {(a b; b a)}: a subspace of dimension 2.
b) I₂ ∈ W (I² − I = O) but 2I₂ ∉ W: (2I)² − 2I = 4I − 2I = 2I ≠ O. Not closed under scalars."""

