# ---------------------------------------------------------------- Esercizio 11
[[item]]
id = "F03-E11"
ref = "Esercizio 11"
topic = "rank"
page = 3
task = "values"
text = """
Si determinino tutte le coppie (a, b) ∈ R² tali che l'insieme delle soluzioni del sistema
(1 1 a; a b 1; 1 a −1)·X = (a, 0, a)ᵀ sia un sottospazio vettoriale di R³ di dimensione 1."""
[item.data]
answers = [["a", 0], ["b", 1]]
why = """A solution set is a subspace only if it contains 0, i.e. the system is homogeneous: a = 0.
Then the matrix is (1 1 0; 0 b 1; 1 0 −1) with det = 1 − b; dim Sol = 3 − rank = 1 ⇔ rank 2 ⇔ b = 1
(the rank is never 1 because the first two columns are independent). Only pair: (a, b) = (0, 1)."""
