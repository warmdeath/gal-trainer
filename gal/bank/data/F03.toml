# ---------------------------------------------------------------- Esercizio 2
[[item]]
id = "F03-E2a"
ref = "Esercizio 2 a)"
topic = "determinant"
page = 1
task = "values"
text = "Sia A ∈ M_R(3) con det(A) = 2. Calcolare il determinante di A⁻¹, A², AᵀA, AAᵀ, 2A e 3A⁻¹."
[item.data]
answers = [["det(A^-1)", "1/2"], ["det(A^2)", 4], ["det(A^T A)", 4], ["det(A A^T)", 4], ["det(2A)", 16], ["det(3A^-1)", "27/2"]]
why = "Binet: det(XY) = det X det Y; det(Aᵀ) = det A; det(A⁻¹) = 1/det A; det(λA) = λ³ det A for 3×3: det(2A) = 8·2 = 16, det(3A⁻¹) = 27·(1/2)."

[[item]]
id = "F03-E2b"
ref = "Esercizio 2 b)"
topic = "determinant"
page = 1
task = "values"
text = """
Sia A = (c1, c2, c3, c4) ∈ M_R(4) con det(A) = 3 (ci = colonne). Calcolare il determinante di
B = (c1, 2c2, −3c3, 4c4),  C = (c1, c1 + c2, c1 + c2 + c3, c4),  D = (c4, c1, c2, c3),
E = (c1 + c2, c2 + c3, c3 + c1, c1 + c2 + c3)."""
[item.data]
answers = [["det B", -72], ["det C", 3], ["det D", -3], ["det E", 0]]
why = """det is multilinear and alternating in the columns (Fatto 1.26):
B: 2·(−3)·4·3 = −72.  C: subtract columns (c1+c2 − c1 = c2, ...) without changing det → det A = 3.
D: (c4,c1,c2,c3) → (c1,c2,c3,c4) needs 3 swaps → −3.  E: four columns all in Span(c1,c2,c3) → dependent → 0."""

