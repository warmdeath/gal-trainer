[[item]]
id = "P2202A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
setup = "Nello spazio R³ si considerino le rette r: {x1 = 0, x2 = x3} e s: {x1 = x3, x2 = 1}, e la superficie Ω dei punti equidistanti da r ed s."
text = "a) Verificare che Ω è una quadrica, di equazione x1² − x2² + 2x1x3 − 2x2x3 + 4x2 − 2 = 0."
[item.data]
solution = """
r = Span((0, 1, 1)), s = (0, 1, 0) + Span((1, 0, 1)). d(x, r)² = ‖x‖² − (x2 + x3)²/2, d(x, s)² = ‖x − (0, 1, 0)‖² − (x1 + x3)²/2. Equating, expanding and multiplying by 2 gives x1² − x2² + 2x1x3 − 2x2x3 + 4x2 − 2 = 0."""


[[item]]
id = "P2202A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
text = "b) Scrivere una forma canonica di Ω."
[item.data]
solution = """
A = (1 0 1; 0 −1 −1; 1 −1 0): eigenvalues √3, −√3, 0; no centre and det of the 4 × 4 matrix = 4 ≠ 0: a hyperbolic paraboloid. With λ1λ2c² = −det: 3c² = 4, c = 2/√3. Canonical form √3X² − √3Y² = (4/√3)Z, i.e. X² − Y² = (4/3)Z."""
