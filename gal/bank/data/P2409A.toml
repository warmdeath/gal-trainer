[[item]]
id = "P2409A-D1"
ref = "Parte A, domanda 1"
section = "I"
points = 1
topic = "eigen"
page = 1
task = "mcq"
text = "Siano A, B ∈ Mat_R(n, n) e sia λ autovalore per A con relativo autospazio E_λ. Se v ∈ E_λ e AB = BA allora:"
[item.data]
options = ["Bv = 0", "Bv ∈ E_λ", "Bv ≠ 0", "Bv ∉ E_λ"]
correct = "b"
why = "A(Bv) = B(Av) = B(λv) = λ(Bv): Bv ∈ E_λ (it may be 0, which also lies in E_λ)."


[[item]]
id = "P2409A-D2"
ref = "Parte A, domanda 2"
section = "I"
points = 1
topic = "isometries"
page = 1
task = "mcq"
text = "Data una matrice A ∈ Mat_R(3, 3) simmetrica e con rk(A) < 3. Si può dire che il segno della forma quadratica xᵀAx"
[item.data]
options = ["è definita positiva", "è definita negativa", "sicuramente non è definita positiva", "nessuna delle precedenti"]
correct = "c"
why = "rk A < 3 ⇒ there is v ≠ 0 with Av = 0, so vᵀAv = 0: the form is not definite (neither positive nor negative)."


[[item]]
id = "P2409A-D3"
ref = "Parte A, domanda 3"
section = "I"
points = 1
topic = "projections"
page = 1
task = "mcq"
text = "Sia v = (a, b, c)ᵀ ∈ R³ con ‖v‖ = 1. La matrice A = vvᵀ rappresenta la proiezione ortogonale su Span{v}. Il rango di A è:"
[item.data]
options = ["0", "1", "2", "3"]
correct = "b"
why = "Every column of vvᵀ is a multiple of v and v ≠ 0: rank 1 (its image is Span{v})."


[[item]]
id = "P2409A-D4"
ref = "Parte A, domanda 4"
section = "I"
points = 1
topic = "eigen"
page = 1
task = "mcq"
text = "Data una matrice A ∈ Mat_R(n, n), sappiamo che A − In è invertibile. Allora:"
[item.data]
options = ["la matrice A è ortogonale", "la matrice A è invertibile", "1 non è autovalore di A", "1 è autovalore di A"]
correct = "c"
why = "1 is an eigenvalue ⇔ det(A − I) = 0. A itself may be singular (e.g. A = O)."


[[item]]
id = "P2409A-D5"
ref = "Parte A, domanda 5"
section = "I"
points = 1
topic = "determinant"
page = 1
task = "mcq"
text = "Siano A, B ∈ Mat_R(3, 3) allora"
[item.data]
options = ["det(A − B) = det(B − A)", "det(A − B) = −det(B − A)", "det(A − B) = det(A) − det(B)", "det(A − B) = det(B) − det(A)"]
correct = "b"
why = "A − B = −(B − A) and det(−M) = (−1)³ det M for 3 × 3 matrices."


[[item]]
id = "P2409A-D6"
ref = "Parte A, domanda 6"
section = "I"
points = 1
topic = "affine"
page = 1
task = "mcq"
text = "Si considerino i tre piani π1: ax − z + 1 = 0, π2: ay − z + 1 = 0, π3: ax + ay − 2z + 2 = 0 in R³. Allora:"
[item.data]
options = ["per infiniti valori di a ∈ R i tre piani si incontrano in un solo punto", "per un solo valore di a ∈ R i tre piani si intersecano lungo una retta", "per ogni valore di a ∈ R l'intersezione dei tre piani è vuota", "esiste un valore di a ∈ R per cui i piani coincidono"]
correct = "d"
why = "π3 = π1 + π2, so the three planes always share π1 ∩ π2. For a = 0 all three are z = 1: they coincide. For a ≠ 0 they meet in a line (never in a single point)."


[[item]]
id = "P2409A-D7"
ref = "Parte A, domanda 7"
section = "I"
points = 1
topic = "vector_spaces"
page = 1
task = "mcq"
text = "Si consideri l'insieme S = {(x, y, z)ᵀ ∈ R³ | x² − y² = 1, z = 0}. Si ha che:"
[item.data]
options = ["S contiene una base di R³", "S contiene un insieme di generatori di R³", "S contiene una base del sottospazio {z = 0}", "S è un sottospazio vettoriale di R³"]
correct = "c"
why = "S lies in the plane z = 0 (so no basis or generators of R³) and contains e.g. (1, 0, 0) and (√2, 1, 0), independent: a basis of {z = 0}. 0 ∉ S."


[[item]]
id = "P2409A-D8"
ref = "Parte A, domanda 8"
section = "I"
points = 1
topic = "rep_matrix"
page = 1
task = "mcq"
text = "Si consideri V = R[t]_≤2 e L: V → V, L(a0 + a1t + a2t²) = a0 + a1 + (a1 + 2a2)t + a2t². Allora:"
[item.data]
options = ["L è un endomorfismo diagonalizzabile", "la matrice che rappresenta L rispetto la base {1, t, t²} è ridotta a scala", "la dimensione dell'immagine di L è pari a 2", "la matrice che rappresenta L rispetto la base {1, t, t²} è simmetrica"]
correct = "b"
why = "M = (1 1 0; 0 1 2; 0 0 1): upper triangular with nonzero pivots, i.e. in echelon form. Only eigenvalue 1 with M ≠ I: not diagonalisable; rank 3; not symmetric."


[[item]]
id = "P2409A-D9"
ref = "Parte A, domanda 9"
section = "I"
points = 1
topic = "linear_maps"
page = 1
task = "mcq"
text = "Siano V = Mat_R(2, 2) e W = R³. Allora:"
[item.data]
options = ["non esistono applicazioni lineari fra V e W", "non esistono applicazioni lineari iniettive fra V e W", "non esistono funzioni fra V e W", "non esistono applicazioni lineari suriettive fra V e W"]
correct = "b"
why = "dim V = 4 > 3 = dim W: every linear map has dim ker ≥ 1. Surjective ones exist."


[[item]]
id = "P2409A-D10"
ref = "Parte A, domanda 10"
section = "I"
points = 1
topic = "conics"
page = 1
task = "mcq"
text = "L'insieme {(x, y) ∈ R² : x² − y² − 2x + 2y = 0} definisce"
[item.data]
options = ["una coppia di rette", "una circonferenza reale", "un'iperbole equilatera non degenere", "un punto immaginario"]
correct = "a"
why = "(x − 1)² − (y − 1)² = 0 ⇔ (x − y)(x + y − 2) = 0: two (orthogonal) lines."


[[item]]
id = "P2409A-D11"
ref = "Parte A, domanda 11"
section = "I"
points = 1
topic = "linear_maps"
page = 1
task = "mcq"
text = "Sia T: V → W un'applicazione lineare tra spazi di dimensione finita. Allora"
[item.data]
options = ["dim(ker f) < dim(V)", "dim(ker f) ≤ dim(W)", "dim(V) ≥ dim(Im f)", "dim(W) > dim(Im f)"]
correct = "c"
why = "Nullità + rango: dim V = dim ker + dim Im ≥ dim Im. The zero map violates A and D; B fails when dim V is large."


[[item]]
id = "P2409A-D12"
ref = "Parte A, domanda 12"
section = "I"
points = 1
topic = "diagonalization"
page = 1
task = "mcq"
text = "Sia A ∈ Mat_R(n, n) una matrice diagonalizzabile. Allora"
[item.data]
options = ["rk(A) è il numero di autovalori distinti", "rk(A) è la somma delle molteplicità degli autovalori aventi le stesse molteplicità algebriche e geometriche", "rk(A) è la somma delle molteplicità degli autovalori non nulli", "rk(A) è la somma delle molteplicità degli autovalori positivi"]
correct = "c"
why = "A ~ D diagonal and rk A = rk D = number of nonzero diagonal entries = n − mg(0) = sum of the multiplicities of the nonzero eigenvalues."


