[[item]]
id = "P2409A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "yesno"
setup = "Data la quadrica Q = {x ∈ R³ : x1² + x3² + 2x1x3 + 2√2 x1 + 2x2 + 2√2 x3 + 4 = 0}."
text = "a) Stabilire se la quadrica ammette centro."
data = { answer = false, why = "Centre: Ax = −b with A = (1 0 1; 0 0 0; 1 0 1), b = (√2, 1, √2): the second equation reads 0 = −1, impossible. No centre." }


[[item]]
id = "P2409A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
text = "b) Classificare metricamente e affinemente Q."
[item.data]
solution = """
Q: (x1 + x3)² + 2√2(x1 + x3) + 2x2 + 4 = 0. With u = (x1 + x3)/√2 (orthonormal change): 2u² + 4u + 2x2 + 4 = 0, i.e. 2(u + 1)² + 2(x2 + 1) = 0. Metric canonical form: U² + X = 0 (U = u + 1, X = x2 + 1): a parabolic cylinder (also affinely)."""


[[item]]
id = "P2409A-E3c"
ref = "Esercizio 3 c)"
section = "II"
points = 2
topic = "conics"
page = 4
task = "open"
text = "c) Classificare metricamente e affinemente la conica che si ottiene intersecando Q con il piano x3 = 0."
[item.data]
solution = """
x3 = 0: x1² + 2√2 x1 + 2x2 + 4 = 0 ⇔ (x1 + √2)² + 2(x2 + 1) = 0: a parabola, metric form X² = −2Y (affinely: a parabola)."""
