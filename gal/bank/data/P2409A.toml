[[item]]
id = "P2409A-E1c"
ref = "Esercizio 1 c)"
section = "II"
points = 1
topic = "sum_intersection"
page = 2
task = "open"
text = "c) Determinare a quale dei sottospazi precedenti appartiene il vettore (3, 1, −1)."
[item.data]
solution = """
3 + 3·1 = 6 ≠ 0: not in V; 2·3 + 1 − 1 = 6 ≠ 0: not in W, hence not in V ∩ W. It belongs only to V + W = R³."""


