# ---------------------------------------------------------------- Esercizio 5
[[item]]
id = "F05-E5"
ref = "Esercizio 5"
topic = "linear_maps"
page = 2
task = "values"
text = """
Per a, b, c ∈ R sia A = (1 b a c; 0 a c b; −1 c b a) e L_A: R⁴ → R³. Si determinino tutti gli a, b, c tali che
(3, −2, 1, 1)ᵀ ∈ ker(L_A) e (3, −2, 1)ᵀ ∉ Im(L_A)."""
[item.data]
answers = [["a", 0], ["b", 1], ["c", -1]]
why = """(3,−2,1,1) ∈ ker ⇔ a − 2b + c = −3, −2a + b + c = 0, a + b − 2c = 3 ⇔ a = c + 1, b = c + 2 (c free).
Then Im(L_A) ≠ R³ only if rg(A) < 3: all 3×3 minors vanish iff c = −1. For c = −1, (a,b,c) = (0,1,−1),
rg(A) = 2 and rg(A | (3,−2,1)) = 3, so the vector is not in the image. Unique answer: (0, 1, −1)."""

