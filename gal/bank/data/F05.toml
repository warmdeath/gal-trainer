# ---------------------------------------------------------------- Esercizio 1
[[item]]
id = "F05-E1a"
ref = "Esercizio 1 a)"
topic = "linear_maps"
page = 1
task = "yesno"
text = "f: R² → R³, f(x, y) = (x + y, 2x − 3y, y) è un'applicazione lineare?"
data = { answer = true, why = "Every component is a homogeneous linear expression: f = L_A with A = (1 1; 2 −3; 0 1)." }

