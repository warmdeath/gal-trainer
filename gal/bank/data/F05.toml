# ---------------------------------------------------------------- Esercizi 7, 8
[[item]]
id = "F05-E7"
ref = "Esercizio 7"
topic = "linear_maps"
page = 2
task = "open"
text = """
Sia V reale con dim V = 2n e f: V → V lineare con n = dim(ker(f) + Im(f)). Dimostrare che ker(f) = Im(f).
(Suggerimento: nullità più rango e formula di Grassmann.)"""
[item.data]
solution = """
Let k = dim ker f, r = dim Im f: k + r = 2n (nullità + rango). Grassmann:
dim(ker f ∩ Im f) = k + r − dim(ker f + Im f) = 2n − n = n.
But ker f ∩ Im f ⊆ ker f and ⊆ Im f, so n ≤ k and n ≤ r; with k + r = 2n this forces k = r = n.
Then ker f ∩ Im f has the same dimension n as ker f and as Im f, so ker f = ker f ∩ Im f = Im f (Teorema 2.16)."""

[[item]]
id = "F05-E8"
ref = "Esercizio 8"
topic = "linear_maps"
page = 2
task = "open"
text = """
a) Fornire un esempio di mappa lineare L: R⁴ → R⁴ con dim Im(L) = dim ker(L).
b) Spiegare perché non esiste f: R³ → R³ lineare con dim Im(f) = dim ker(f)."""
[item.data]
solution = """
a) L(x1, x2, x3, x4) = (x3, x4, 0, 0): ker L = Span(e1, e2), Im L = Span(e1, e2), both of dimension 2.
b) Nullità più rango: dim ker f + dim Im f = 3. If they were equal, 2·dim ker f = 3, impossible (3 is odd)."""
