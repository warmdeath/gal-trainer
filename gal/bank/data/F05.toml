# ---------------------------------------------------------------- Esercizio 2
[[item]]
id = "F05-E2a"
ref = "Esercizio 2 a)"
topic = "linear_maps"
page = 1
task = "kerim"
text = "f: R⁴ → R³, f(x, y, z, t) = (x + 2y + z − 2t, 2x + 4y + 2z + 4t, −t). Determinare dim Im f e dim ker f."
data = { A = [[1, 2, 1, -2], [2, 4, 2, 4], [0, 0, 0, -1]] }

[[item]]
id = "F05-E2b"
ref = "Esercizio 2 b)"
topic = "linear_maps"
page = 1
task = "yesno"
text = """
Sia W ◁ R⁴ generato da {(−3, 1, 1, 0), (0, 1, −2, 0), (−3, −1, 5, 0)} (con f come nel punto a)).
Si dimostri che W ⊆ ker f. Vale l'uguaglianza W = ker f?"""
data = { answer = true, why = "Each generator satisfies the three equations of f, so W ⊆ ker f. dim ker f = 4 − rg(f) = 4 − 2 = 2 and dim W = 2 (third generator = first − 2·second): equal dimensions ⇒ W = ker f (Teorema 2.16)." }

