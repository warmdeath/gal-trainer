[[item]]
id = "P2602AV1-E2ii"
ref = "Esercizio 2 ii)"
section = "II"
points = 2.2
topic = "linear_maps"
page = 3
task = "open"
text = "ii) Si verifichi che la funzione f: W → V, f(X) = AX + XᵀA con A := (1 2; −2 3) è un'applicazione lineare."
[item.data]
solution = """
For X, Y ∈ W and λ, μ ∈ R:
f(λX + μY) = A(λX + μY) + (λX + μY)ᵀA = λAX + μAY + (λXᵀ + μYᵀ)A = λ(AX + XᵀA) + μ(AY + YᵀA) = λf(X) + μf(Y),
by distributivity of the matrix product and linearity of the transpose."""

