# ================================================================ Parte I
[[item]]
id = "P2602AV1-D1"
ref = "Domanda 1"
section = "I"
points = 1
topic = "vector_spaces"
page = 1
task = "mcq"
text = "Quale dei seguenti sottoinsiemi è un sottospazio vettoriale di R²?"
[item.data]
options = ["{(a, b)ᵀ ∈ R² : a + b ≥ 0}", "{(a, b)ᵀ ∈ R² : ab ≥ 0}", "{(a, b)ᵀ ∈ R² : a + b = 0}", "{(a, b)ᵀ ∈ R² : a + b² = 0}"]
correct = "c"
why = "a + b = 0 is a line through the origin. The others are a half-plane, two quadrants (not closed under sum) and a parabola."

[[item]]
id = "P2602AV1-D2"
ref = "Domanda 2"
section = "I"
points = 1
topic = "rank"
page = 1
task = "mcq"
text = "Siano A ∈ M_R(3) e b ∈ R³ tali che il sistema lineare Ax = 0 ha infinite soluzioni. Quale affermazione è sicuramente vera?"
[item.data]
options = ["Il sistema lineare Ax = b non ha soluzioni.", "Il sistema lineare Ax = b ha un'unica soluzione.", "Il sistema lineare Ax = b ha infinite soluzioni.", "Il numero di soluzioni del sistema lineare Ax = b dipende da b."]
correct = "d"
why = "ker A ≠ {0} so rg(A) < 3. By Rouché-Capelli: if rg(A|b) = rg(A) there are infinitely many solutions, otherwise none: it depends on b."

[[item]]
id = "P2602AV1-D3"
ref = "Domanda 3"
section = "I"
points = 1
topic = "determinant"
page = 1
task = "mcq"
text = "Tra le seguenti identità si selezioni quella corretta."
[item.data]
options = ["det(M1 + M2) = det(M1) + det(M2) per ogni M1, M2 ∈ M_R(3)", "det(a1 + a2 | a3 | a4) = det(a1 | a3 | a4) + det(a2 | a3 | a4) per ogni a1, a2, a3, a4 ∈ R³", "det(cM) = c det(M) per ogni c ∈ R, M ∈ M_R(3)", "det(2M) = det(M)² per ogni M ∈ M_R(3)"]
correct = "b"
why = "det is linear in each column (multilinearity). With M1 = M2 = M = I: det(2I) = 8 ≠ 2 = det I + det I, det(cI) = c³ ≠ c, det(2I) = 8 ≠ 1."

[[item]]
id = "P2602AV1-D4"
ref = "Domanda 4"
section = "I"
points = 1
topic = "conics"
page = 1
task = "mcq"
text = "La conica di equazione 2x² − 3xy − 2y² − 5y − 3 = 0 è"
[item.data]
options = ["un'iperbole.", "un'ellisse.", "una parabola.", "l'unione di due rette parallele."]
correct = "a"
why = "A = (2 −3/2; −3/2 −2), det A = −4 − 9/4 < 0: eigenvalues ±5/2 of opposite sign. The conic has centre (−3/5, −4/5) and c' = −1 ≠ 0, so it is a non-degenerate hyperbola: (5/2)z1² − (5/2)z2² − 1 = 0."

[[item]]
id = "P2602AV1-D5"
ref = "Domanda 5"
section = "I"
points = 1
topic = "scalar_products"
page = 1
task = "mcq"
text = "Sia (V, ⟨·,·⟩) uno spazio euclideo. Quale delle seguenti identità vale per ogni v, w ∈ V?"
[item.data]
options = ["‖v + w‖ = ‖v‖ + ‖w‖", "‖v‖‖w‖ = ⟨v, w⟩", "‖v + w‖² − ‖v‖² − ‖w‖² = 2⟨v, w⟩", "‖v + w‖² = ‖v‖² + ‖w‖²"]
correct = "c"
why = "‖v + w‖² = ⟨v + w, v + w⟩ = ‖v‖² + 2⟨v, w⟩ + ‖w‖² (polarisation). D is Pythagoras, true only if v ⊥ w."

[[item]]
id = "P2602AV1-D6"
ref = "Domanda 6"
section = "I"
points = 1
topic = "sum_intersection"
page = 2
task = "mcq"
text = "In R⁴ si considerino i piani H = Span((1,1,0,0), (1,1,1,0)) e K_m = Span((1,1,1,1), (m,1,0,1)), con m ∈ R parametro. Per quali valori di m si ha dim(H ∩ K_m) = 1?"
[item.data]
options = ["Solo per m = 0.", "Solo per m = 1.", "Per ogni m ≠ 0.", "Per ogni m ≠ 1."]
correct = "b"
why = "dim H = dim K_m = 2; the 4 vectors reduce to rank 3 if m = 1, 4 otherwise. Grassmann: dim(H ∩ K_m) = 2 + 2 − dim(H + K_m) = 1 only for m = 1."

[[item]]
id = "P2602AV1-D7"
ref = "Domanda 7"
section = "I"
points = 1
topic = "diagonalization"
page = 2
task = "mcq"
text = "Per quali valori del parametro r ∈ R la matrice (2 1; 0 r) ∈ M_R(2) è diagonalizzabile?"
[item.data]
options = ["Solo per r = 1.", "Per ogni r ≠ 1.", "Solo per r = 2.", "Per ogni r ≠ 2."]
correct = "d"
why = "Triangular: eigenvalues 2 and r. If r ≠ 2 they are distinct → diagonalisable. If r = 2, mg(2) = 2 − rg(0 1; 0 0) = 1 < 2 = ma(2)."

[[item]]
id = "P2602AV1-D8"
ref = "Domanda 8"
section = "I"
points = 1
topic = "linear_maps"
page = 2
task = "mcq"
text = "Sia V uno spazio vettoriale con base {v1, v2, v3} e L: V → V lineare con L(v1) = 2v1 + v2, L(v2) = v2 + 2v3, L(v3) = v1 + v2 + v3. Allora"
[item.data]
options = ["ker(L) = Span(v1 + v2 − 2v3).", "L è suriettiva.", "L è iniettiva.", "Im(L) = Span(v1 + v2 + v3)."]
correct = "a"
why = "L(v1 + v2 − 2v3) = (2v1 + v2) + (v2 + 2v3) − 2(v1 + v2 + v3) = 0, and the matrix (2 0 1; 1 1 1; 0 2 1) has rank 2, so ker L has dim 1 and L is neither injective nor surjective; dim Im L = 2."

[[item]]
id = "P2602AV1-D9"
ref = "Domanda 9"
section = "I"
points = 1
topic = "affine"
page = 2
task = "mcq"
text = "Date le rette l1 = (4, 3, 2) + R(1, −1, −2) e l2 = (1, 2, 1) + R(3, 1, 1) in R³. Allora:"
[item.data]
options = ["l1 e l2 sono incidenti, ma non ortogonali.", "l1 e l2 sono parallele.", "l1 e l2 sono sghembe.", "l1 e l2 sono incidenti ed ortogonali."]
correct = "d"
why = "(4 + t, 3 − t, 2 − 2t) = (1 + 3s, 2 + s, 1 + s) gives s = 1, t = 0: they meet at (4, 3, 2). (1, −1, −2)·(3, 1, 1) = 3 − 1 − 2 = 0: orthogonal."

[[item]]
id = "P2602AV1-D10"
ref = "Domanda 10"
section = "I"
points = 1
topic = "span_independence"
page = 2
task = "mcq"
text = "Per p ∈ {0, ..., 3}, sia v_p := (1, p, p + 1)ᵀ ∈ R³. La dimensione di Span(v0, ..., v3) è"
[item.data]
options = ["1", "2", "3", "4"]
correct = "b"
why = "v_p = (1, 0, 1) + p(0, 1, 1): all v_p lie in Span((1,0,1), (0,1,1)) and v0, v1 are independent, so the dimension is 2."

