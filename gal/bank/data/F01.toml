[[item]]
id = "F01-E2ab"
ref = "Esercizio 2 a) b)"
topic = "matrices"
page = 1
task = "open"
text = """
Si considerino le matrici reali
A = (0 1 2; 1 1 0),  B = (1 0 2; 1 2 1; 1 0 0),  C = (1 3 2; 2 0 1),  D = (0 1; −1 1),
E = (1 2; 1 −1; 0 1).
a) Quali coppie di matrici possono essere sommate?
b) Quali coppie di matrici possono essere moltiplicate?"""
[item.data]
solution = """
Types: A ∈ M(2,3), B ∈ M(3,3), C ∈ M(2,3), D ∈ M(2,2), E ∈ M(3,2).
a) Only matrices of the same type can be added: A + C (and each matrix with itself).
b) X·Y is defined iff #columns(X) = #rows(Y):
   A·B, A·E, C·B, C·E, B·B, B·E, D·A, D·C, D·D, E·A, E·C, E·D."""

[[item]]
id = "F01-E2c"
ref = "Esercizio 2 c)"
topic = "matrices"
page = 1
task = "matexpr"
text = """
Determinare (se possibile): A + C, A·B, B·(A + C), (E·A)·B, (B·E)·C, (A·E) + Dᵀ, Eᵀ·D, E·Eᵀ, A·Cᵀ.
(Type 'not defined' when the operation is impossible.)"""
[item.data]
exprs = ["A + C", "A*B", "B*(A + C)", "(E*A)*B", "(B*E)*C", "(A*E) + D^T", "E^T*D", "E*E^T", "A*C^T"]
[item.data.matrices]
A = [[0, 1, 2], [1, 1, 0]]
B = [[1, 0, 2], [1, 2, 1], [1, 0, 0]]
C = [[1, 3, 2], [2, 0, 1]]
D = [[0, 1], [-1, 1]]
E = [[1, 2], [1, -1], [0, 1]]

[[item]]
id = "F01-E2d"
ref = "Esercizio 2 d)"
topic = "matrices"
page = 1
task = "open"
text = """
Per ciascuna delle seguenti coppie, si determini se entrambi i prodotti possono essere
determinati e se il risultato è lo stesso (senza calcolarli esplicitamente):
(E·A)·B e E·(A·B),   A·E e E·A,   C·D e D·C."""
[item.data]
solution = """
• (E·A)·B and E·(A·B): both defined (3×2·2×3·3×3) and EQUAL — the product is associative.
• A·E ∈ M(2,2) and E·A ∈ M(3,3): both defined but different (they are not even of the same type).
• C·D is NOT defined (C has 3 columns, D has 2 rows); D·C ∈ M(2,3) is defined."""

