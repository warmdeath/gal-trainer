[[item]]
id = "F01-E4b2"
ref = "Esercizio 4 b) P3, P4, P5"
topic = "lines_planes"
page = 1
task = "open"
text = "Si trovi un piano contenente P3 = (1, 2, 3), P4 = (3, 4, 5) e P5 = (5, 6, 7)."
[item.data]
solution = """
P4 − P3 = (2, 2, 2) and P5 − P3 = (4, 4, 4) are parallel: the three points are COLLINEAR
(they lie on the line (1,2,3) + t(1,1,1)). So there are infinitely many planes containing them:
the whole fascio of planes through that line. For example x − y + 1 = 0 (check: 1 − 2 + 1 = 0,
3 − 4 + 1 = 0, 5 − 6 + 1 = 0) or y − z + 1 = 0."""
