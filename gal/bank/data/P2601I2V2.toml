[[item]]
id = "P2601I2V2-E2iii"
ref = "Esercizio 2 iii)"
section = "II"
points = 2.2
topic = "projections"
page = 3
task = "open"
text = "iii) Si trovino nucleo e immagine della proiezione ortogonale π_H: R⁴ → R⁴ e si spieghi perché sono autospazi di π_H."
[item.data]
solution = """
ker π_H = H⊥ (π_H(v) = 0 ⇔ v ⊥ H): it is the eigenspace V_0. Im π_H = H, since π_H(v) ∈ H for all v and π_H(w) = w for w ∈ H:
H ⊆ V_1, and since R⁴ = H ⊕ H⊥ the eigenspace V_1 cannot be bigger, so V_1 = H = Im π_H."""

[[item]]
id = "P2601I2V2-E2iv"
ref = "Esercizio 2 iv)"
section = "II"
points = 2.2
topic = "isometries"
page = 3
task = "open"
text = "iv) Si usino le informazioni al punto iii) per concludere che π_H è un endomorfismo simmetrico."
[item.data]
solution = """
An orthogonal basis B0 of H⊥ together with an orthogonal basis B1 of H (Gram-Schmidt) is an orthogonal basis of R⁴ made of
eigenvectors of π_H. So π_H is orthogonally diagonalisable, hence symmetric by the spectral theorem."""

