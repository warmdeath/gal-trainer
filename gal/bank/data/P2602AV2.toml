# ================================================================ Parte I
[[item]]
id = "P2602AV2-D1"
ref = "Domanda 1"
section = "I"
points = 1
topic = "span_independence"
page = 1
task = "mcq"
text = "Per p ∈ {0, ..., 3}, sia v_p = (p, p, p)ᵀ ∈ R³. La dimensione di Span(v0, ..., v3) è"
[item.data]
options = ["1", "2", "3", "4"]
correct = "a"
why = "Every v_p is a multiple of (1, 1, 1) (v0 = 0), so the span is the line Span((1, 1, 1)): dimension 1."

[[item]]
id = "P2602AV2-D2"
ref = "Domanda 2"
section = "I"
points = 1
topic = "linear_maps"
page = 1
task = "mcq"
text = "Sia V uno spazio vettoriale con base {v1, v2, v3} e L: V → V lineare con L(v1) = v1 − 2v2, L(v2) = 2v2 − v3, L(v3) = v3 − v1. Allora"
[item.data]
options = ["L è suriettiva.", "Im(L) = Span(v1 + v2 − 2v3).", "L è iniettiva.", "ker(L) = Span(v1 + v2 + v3)."]
correct = "d"
why = "L(v1 + v2 + v3) = (v1 − 2v2) + (2v2 − v3) + (v3 − v1) = 0 and the matrix (1 0 −1; −2 2 0; 0 −1 1) has rank 2: ker L = Span(v1 + v2 + v3), dim Im L = 2."

[[item]]
id = "P2602AV2-D3"
ref = "Domanda 3"
section = "I"
points = 1
topic = "affine"
page = 1
task = "mcq"
text = "Date le rette l1 = (4, 3, 2) + R(1, 1, −2) e l2 = (1, 2, 1) + R(3, 1, 1) in R³. Allora:"
[item.data]
options = ["l1 e l2 sono incidenti, ma non ortogonali.", "l1 e l2 sono incidenti ed ortogonali.", "l1 e l2 sono parallele.", "l1 e l2 sono sghembe."]
correct = "a"
why = "(4 + t, 3 + t, 2 − 2t) = (1 + 3s, 2 + s, 1 + s) gives s = 1, t = 0: they meet at (4, 3, 2). (1, 1, −2)·(3, 1, 1) = 2 ≠ 0: not orthogonal."

[[item]]
id = "P2602AV2-D4"
ref = "Domanda 4"
section = "I"
points = 1
topic = "rank"
page = 1
task = "mcq"
text = "Siano A ∈ M_R(3) e b ∈ R³ tali che il sistema lineare Ax = b non ha soluzioni. Quale affermazione è vera?"
[item.data]
options = ["Il sistema lineare Ax = 0 non ha soluzioni.", "Il sistema lineare Ax = 0 ha un'unica soluzione.", "Il sistema lineare Ax = 0 ha infinite soluzioni.", "Nessuna delle altre."]
correct = "c"
why = "If A were invertible Ax = b would have a solution, so rg(A) < 3 and the homogeneous system has ∞^(3 − rg A) solutions (it always has at least 0)."

[[item]]
id = "P2602AV2-D5"
ref = "Domanda 5"
section = "I"
points = 1
topic = "vector_spaces"
page = 1
task = "mcq"
text = "Quale dei seguenti sottoinsiemi è un sottospazio vettoriale di R²?"
[item.data]
options = ["{(a, b)ᵀ ∈ R² : a² − b² = 0}", "{(a, b)ᵀ ∈ R² : ab ≤ 0}", "{(a, b)ᵀ ∈ R² : a + b ≥ 0}", "{(a, b)ᵀ ∈ R² : a − b = 0}"]
correct = "d"
why = "a − b = 0 is a line through the origin. a² − b² = 0 is two lines (not closed under sum), ab ≤ 0 two quadrants, a + b ≥ 0 a half-plane."

[[item]]
id = "P2602AV2-D6"
ref = "Domanda 6"
section = "I"
points = 1
topic = "conics"
page = 2
task = "mcq"
text = "La conica di equazione 2x² − 3xy + 2y² − 5y − 3 = 0 è"
[item.data]
options = ["l'unione di due rette parallele.", "un'ellisse.", "una parabola.", "un'iperbole."]
correct = "b"
why = "A = (2 −3/2; −3/2 2), det A = 4 − 9/4 = 7/4 > 0 with positive trace: both eigenvalues positive. The constant term after centring is negative, so it is a real ellipse."

[[item]]
id = "P2602AV2-D7"
ref = "Domanda 7"
section = "I"
points = 1
topic = "sum_intersection"
page = 2
task = "mcq"
text = "In R⁴ si considerino i piani H = Span((1,1,0,0), (1,1,1,1)) e K_m = Span((1,0,1,1), (1,0,m,0)), con m ∈ R parametro. Per quali valori di m si ha dim(H ∩ K_m) = 1?"
[item.data]
options = ["Solo per m = 0.", "Per ogni m ≠ 0.", "Solo per m = 1.", "Per ogni m ≠ 1."]
correct = "a"
why = "det of the 4 vectors = −m: they span R⁴ unless m = 0, when dim(H + K_m) = 3 and by Grassmann dim(H ∩ K_m) = 2 + 2 − 3 = 1."

[[item]]
id = "P2602AV2-D8"
ref = "Domanda 8"
section = "I"
points = 1
topic = "scalar_products"
page = 2
task = "mcq"
text = "Sia (V, ⟨·,·⟩) uno spazio euclideo. Quale delle seguenti identità vale per ogni v, w ∈ V?"
[item.data]
options = ["‖v + w‖² = ‖v‖² + ‖w‖²", "‖v + w‖ = ‖v‖ + ‖w‖", "‖v‖‖w‖ = ⟨v, w⟩", "‖v + w‖² − ‖v‖² − ‖w‖² = 2⟨v, w⟩"]
correct = "d"
why = "‖v + w‖² = ‖v‖² + 2⟨v, w⟩ + ‖w‖² (polarisation); A is Pythagoras (only if v ⊥ w)."

[[item]]
id = "P2602AV2-D9"
ref = "Domanda 9"
section = "I"
points = 1
topic = "diagonalization"
page = 2
task = "mcq"
text = "Per quali valori del parametro r ∈ R la matrice (1 2; 0 r) ∈ M_R(2) è diagonalizzabile?"
[item.data]
options = ["Per ogni r ≠ 1.", "Solo per r = 1.", "Per ogni r ≠ 2.", "Solo per r = 2."]
correct = "a"
why = "Eigenvalues 1 and r: distinct for r ≠ 1. For r = 1, mg(1) = 2 − rg(0 2; 0 0) = 1 < 2."

[[item]]
id = "P2602AV2-D10"
ref = "Domanda 10"
section = "I"
points = 1
topic = "determinant"
page = 2
task = "mcq"
text = "Tra le seguenti identità si selezioni quella corretta."
[item.data]
options = ["det(a1 + a2 | a3 | a4) = det(a1 | a3 | a4) + det(a2 | a3 | a4) per ogni a1, a2, a3, a4 ∈ R³", "det(M1 + M2) = det(M1) + det(M2) per ogni M1, M2 ∈ M_R(3)", "det(cM) = c det(M) per ogni c ∈ R, M ∈ M_R(3)", "det(2M) = det(M)² per ogni M ∈ M_R(3)"]
correct = "a"
why = "det is linear in each column. With M = I: det(2I) = 8, det(cI) = c³, det(I + I) = 8 ≠ 2."

