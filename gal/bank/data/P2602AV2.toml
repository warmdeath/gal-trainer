[[item]]
id = "P2602AV2-E3i"
ref = "Esercizio 3 i)"
section = "II"
points = 2.2
topic = "isometries"
page = 3
task = "open"
setup = "Sia A ∈ M_R(3) una matrice simmetrica."
text = "i) Si verifichi che A² è simmetrica."
[item.data]
solution = "(A²)ᵀ = (AA)ᵀ = AᵀAᵀ = AA = A², using (XY)ᵀ = YᵀXᵀ and Aᵀ = A."

[[item]]
id = "P2602AV2-E3ii"
ref = "Esercizio 3 ii)"
section = "II"
points = 2.2
topic = "eigen"
page = 3
task = "open"
text = "ii) Sia v un autovettore di A associato ad un autovalore λ. Si verifichi che è anche un autovettore di A²; qual è l'autovalore associato?"
[item.data]
solution = "v ≠ 0 and Av = λv, so A²v = A(λv) = λAv = λ²v: v is an eigenvector of A² with eigenvalue λ²."

[[item]]
id = "P2602AV2-E3iii"
ref = "Esercizio 3 iii)"
section = "II"
points = 2.2
topic = "isometries"
page = 3
task = "open"
text = "iii) Siano λ1, λ2, λ3 gli autovalori di A e si supponga det(A) ≠ 0. Si determinino gli autovalori di A² e si dimostri che la forma quadratica associata a A² è definita positiva."
[item.data]
solution = """
Spectral theorem: A = PDPᵀ, P orthogonal, D = diag(λ1, λ2, λ3); A² = PD²Pᵀ has eigenvalues λ1², λ2², λ3².
det A = λ1λ2λ3 ≠ 0, so every λi ≠ 0 and λi² > 0: the form xᵀA²x is positive definite.
Directly: xᵀA²x = (Ax)ᵀ(Ax) = ‖Ax‖² ≥ 0, with equality only if Ax = 0, i.e. x = 0 since A is invertible.
"""
