[[item]]
id = "P2602AV2-E2ii"
ref = "Esercizio 2 ii)"
section = "II"
points = 2.2
topic = "linear_maps"
page = 3
task = "open"
text = "ii) Si verifichi che la funzione f: W → V, f(X) = AXᵀ + XA con A := (3 −1; 1 −2) è un'applicazione lineare."
[item.data]
solution = """
For M, N ∈ W and α ∈ R:
f(M + N) = A(M + N)ᵀ + (M + N)A = AMᵀ + MA + ANᵀ + NA = f(M) + f(N),
f(αM) = A(αM)ᵀ + (αM)A = α(AMᵀ + MA) = αf(M),
by distributivity of the product and linearity of the transpose."""

