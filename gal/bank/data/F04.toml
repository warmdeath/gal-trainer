[[item]]
id = "F04-E10a"
ref = "Esercizio 10 a)"
topic = "affine"
page = 3
task = "open"
text = "In R³ sia r: 2(y − 1) = z, 4(x − 2) = 3z. Si scriva l'equazione del fascio di piani per r."
[item.data]
solution = """
Write r as 2y − z − 2 = 0 and 4x − 3z − 8 = 0. The fascio (Def. 2.32):
   λ(2y − z − 2) + μ(4x − 3z − 8) = 0,   (λ, μ) ≠ (0, 0)."""

