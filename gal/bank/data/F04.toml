# ---------------------------------------------------------------- Esercizio 8
[[item]]
id = "F04-E8a"
ref = "Esercizio 8 a)"
topic = "affine"
page = 3
task = "open"
text = "Date due rette in R³, quando esiste un piano che le contiene entrambe?"
[item.data]
solution = """
Exactly when they are NOT skew: if they are incident (one plane: point of intersection + both directions),
parallel and distinct (one plane: a point, the common direction and P2 − P1), or coincident (infinitely many
planes: the whole fascio through the line). Skew lines lie in no common plane."""

