# ---------------------------------------------------------------- Esercizio 2
[[item]]
id = "F04-E2"
ref = "Esercizio 2"
topic = "bases"
page = 1
task = "values"
text = """
Per ciascuno dei seguenti sottospazi di M_K(4) si trovi una base e la dimensione:
matrici diagonali, triangolari superiori, triangolari inferiori, simmetriche, anti-simmetriche (A = −Aᵀ)."""
[item.data]
answers = [["dim diagonal", 4], ["dim upper triangular", 10], ["dim lower triangular", 10], ["dim symmetric", 10], ["dim antisymmetric", 6]]
why = """Bases (E_ij = matrix with a single 1 in position (i,j)):
diagonal: E11, E22, E33, E44 (4).  Upper: E_ij with i ≤ j (4 + 3 + 2 + 1 = 10).  Lower: E_ij with i ≥ j (10).
Symmetric: E_ii (4) and E_ij + E_ji for i < j (6): 10.  Antisymmetric: the diagonal is 0, basis E_ij − E_ji for i < j: 6."""

