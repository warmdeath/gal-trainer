# ================================================================ Compiti (open)
[[item]]
id = "Q02-C1"
ref = "Compito 1"
topic = "vector_spaces"
page = 1
task = "open"
text = """
In R² si forniscano esempi di: a) S1 chiuso per il prodotto per scalare ma non per la somma; b) S2 chiuso per la somma
ma non per il prodotto per scalare; c) come a) ma contenente un sottospazio V3 di dimensione 1; d) come b) ma contenente
un sottospazio V4 di dimensione 1."""
[item.data]
solution = """
a) S1 = {xy = 0} (union of the two axes): λ(x, y) stays on the same axis, but (1,0) + (0,1) = (1,1) ∉ S1.
b) S2 = {x ≥ 0, y ≥ 0} (first quadrant): closed under sum, but (−1)·(1,0) ∉ S2. (Also Z² works.)
c) The same S1 = {xy = 0}: it contains the line V3 = {y = 0}.
d) S4 = {y ≥ 0} (upper half-plane): closed under sum, not under (−1)·, and it contains V4 = {y = 0}."""

[[item]]
id = "Q02-C2"
ref = "Compito 2"
topic = "vector_spaces"
page = 1
task = "open"
text = """
Sia v ∈ Rⁿ, v ≠ 0 e V := M_R(n). Dimostrare o confutare: a) {M | M·v = 0} è uno spazio vettoriale;
b) {M | M·v = v} è uno spazio vettoriale; c) {M | ∃λ ∈ R : M·v = λv} è uno spazio vettoriale."""
[item.data]
solution = """
a) TRUE: it is the kernel of the linear map M ↦ Mv (O·v = 0; (M+N)v = 0; (cM)v = 0).
b) FALSE: O·v = 0 ≠ v, so O is not in it.
c) TRUE: O·v = 0·v; if Mv = λv and Nv = μv then (M + N)v = (λ + μ)v and (cM)v = (cλ)v.
   (It is {M | Mv ∈ Span(v)}.)"""

[[item]]
id = "Q02-C3"
ref = "Compito 3"
topic = "span_independence"
page = 1
task = "open"
text = "Se {v1, ..., vn} sono linearmente indipendenti, allora v1, ..., vn, v_{n+1} sono linearmente dipendenti se e solo se v_{n+1} ∈ Span(v1, ..., vn)."
[item.data]
solution = """
⇐) If v_{n+1} = Σ a_i v_i then Σ a_i v_i − v_{n+1} = 0 is a non-trivial relation (coefficient −1).
⇒) Take λ1 v1 + ... + λn vn + λ_{n+1} v_{n+1} = 0 with not all λ zero. If λ_{n+1} = 0, the relation involves only
v1..vn, which are independent ⇒ all λ = 0, contradiction. So λ_{n+1} ≠ 0 and v_{n+1} = −Σ (λ_i/λ_{n+1}) v_i ∈ Span(v1..vn)."""

[[item]]
id = "Q02-C4"
ref = "Compito 4"
topic = "bases"
page = 1
task = "open"
text = "In K[t]≤3 fornire esempi di un insieme di generatori non linearmente indipendente e di un insieme di vettori linearmente indipendenti che non è un insieme di generatori."
[item.data]
solution = """
Generators but dependent: {1, t, t², t³, 1 + t} (5 vectors in a space of dimension 4).
Independent but not generators: {1, t} (2 < 4 = dim K[t]≤3)."""

[[item]]
id = "Q02-C5"
ref = "Compito 5"
topic = "sum_intersection"
page = 1
task = "open"
text = """
U, W ◁ V. Si dimostri che sono equivalenti: 1. la somma U + W è diretta (U ∩ W = {0});
2. se u ∈ U, w ∈ W e u + w = 0 allora u = w = 0; 3. ogni v ∈ U + W si scrive in modo unico come v = u + w."""
[item.data]
solution = """
1 ⇒ 2: u + w = 0 ⇒ u = −w ∈ U ∩ W = {0}.
2 ⇒ 3: if v = u + w = u′ + w′ then (u − u′) + (w − w′) = 0 with u − u′ ∈ U, w − w′ ∈ W ⇒ both 0.
3 ⇒ 1: if x ∈ U ∩ W then 0 = 0 + 0 = x + (−x) are two decompositions of 0; uniqueness gives x = 0."""

[[item]]
id = "Q02-C6"
ref = "Compito 6"
topic = "sum_intersection"
page = 1
task = "open"
text = """
a) Esempi di U, V ⊂ R³ sottospazi con: i) U ∪ V non sottospazio; ii) U ∪ V sottospazio; iii) U + V = R³ ma somma non diretta; iv) U ⊕ V = R³.
b) Dimostrare che U ∪ W è un sottospazio se e solo se U ⊆ W o W ⊆ U."""
[item.data]
solution = """
a) i) U = x-axis, V = y-axis.  ii) U = V (or U ⊆ V).  iii) U = {z = 0}, V = {x = 0}: U + V = R³, U ∩ V = y-axis.
   iv) U = {z = 0}, V = z-axis.
b) ⇐ trivial (U ∪ W is the bigger one). ⇒ Suppose U ⊄ W and W ⊄ U: take u ∈ U \\ W, w ∈ W \\ U. If u + w ∈ U then
w = (u + w) − u ∈ U, impossible; if u + w ∈ W then u ∈ W, impossible. So u + w ∉ U ∪ W: not closed under sum."""

[[item]]
id = "Q02-C7"
ref = "Compito 7"
topic = "affine"
page = 1
task = "open"
text = "a) Si dimostri che in R⁴ non esistono piani sghembi. b) Si dia un esempio di 2 piani sghembi in R⁵."
[item.data]
solution = """
a) Skew planes need S1,0 ∩ S2,0 = {0}; with dim 2 + 2 Grassmann gives S1,0 ⊕ S2,0 = R⁴. Then P2 − P1 = a + b with
a ∈ S1,0, b ∈ S2,0, and P1 + a = P2 − b is a common point: they always meet. So no skew planes in R⁴.
b) π1 = Span(e1, e2), π2 = e5 + Span(e3, e4): giaciture meet only in 0, and a common point would need e5 ∈ Span(e1..e4)."""

