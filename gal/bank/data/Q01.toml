# ================================================================ Compiti (open)
[[item]]
id = "Q01-C1"
ref = "Compito 1"
topic = "systems"
page = 1
task = "open"
text = "Fornire esempi di sistemi lineari senza soluzione, con una soluzione, con infinite soluzioni."
[item.data]
solution = """
No solution: {x + y = 1, x + y = 2} (rg(A) = 1 < rg(A|b) = 2).
Exactly one: {x + y = 2, x − y = 0} → (1, 1) (rg(A) = rg(A|b) = 2 = n).
Infinitely many: {x + y = 2, 2x + 2y = 4} → (t, 2 − t) (rg = 1 < n = 2)."""

[[item]]
id = "Q01-C2"
ref = "Compito 2"
topic = "matrices"
page = 1
task = "open"
text = "Fornire esempi di: due matrici il cui prodotto non commuta; due matrici non nulle con prodotto nullo; una matrice non nulla senza inversa."
[item.data]
solution = """
• A = (1 1; 0 0), B = (1 0; 1 0): AB = (2 0; 0 0), BA = (1 1; 1 1) ≠ AB.
• A = (1 0; 0 0), B = (0 0; 0 1): A, B ≠ O but AB = O.
• (1 1; 1 1) ≠ O has det = 0 (rank 1), so it is not invertible."""

[[item]]
id = "Q01-C3"
ref = "Compito 3"
topic = "rank"
page = 1
task = "open"
text = """
Ax = b con A ∈ M_R(m, n). Dimostrare o confutare:
a) se m < n, il sistema non ha mai un'unica soluzione;  b) se m > n, non ha mai un'unica soluzione;
c) se m = n, ha sempre un'unica soluzione;  d) se ha un'unica soluzione, allora m = n."""
[item.data]
solution = """
a) TRUE: unique ⇔ rg(A) = rg(A|b) = n, but rg(A) ≤ m < n (Lemma 1.15).
b) FALSE: {x = 1, 2x = 2} (m = 2 > n = 1) has the unique solution x = 1.
c) FALSE: 0·x = 0 (m = n = 1) has infinitely many solutions; 0·x = 1 has none.
d) FALSE: the example in b) has a unique solution with m = 2 ≠ n = 1."""

[[item]]
id = "Q01-C4"
ref = "Compito 4"
topic = "inverse"
page = 1
task = "open"
text = "Sia A ∈ M_K(n) invertibile. Dimostrare o confutare: a) A² è invertibile; b) AAᵀ è invertibile; c) A + Aᵀ è invertibile."
[item.data]
solution = """
a) TRUE: (A⁻¹)² is the inverse (or det(A²) = det(A)² ≠ 0).
b) TRUE: det(AAᵀ) = det(A)·det(Aᵀ) = det(A)² ≠ 0; inverse (A⁻¹)ᵀA⁻¹.
c) FALSE: A = (0 1; −1 0) is invertible (det 1) but A + Aᵀ = O."""

[[item]]
id = "Q01-C5"
ref = "Compito 5"
topic = "inverse"
page = 1
task = "open"
text = """
Fornire esempi di matrici invertibili A, B ∈ M_R(2) tali che: a) (AB)⁻¹ ≠ A⁻¹B⁻¹; b) A + B non è invertibile;
c) A + B è invertibile ma (A + B)⁻¹ ≠ A⁻¹ + B⁻¹; d) det(A + B) ≠ det A + det B; e) det(2A) ≠ 2 det A."""
[item.data]
solution = """
a) A = (1 1; 0 1), B = (1 0; 1 1): (AB)⁻¹ = B⁻¹A⁻¹ ≠ A⁻¹B⁻¹ because A⁻¹ and B⁻¹ do not commute.
b) A = I, B = −I: A + B = O.
c) A = B = I: (2I)⁻¹ = ½I ≠ 2I = A⁻¹ + B⁻¹.
d) A = B = I: det(2I) = 4 ≠ 1 + 1.
e) A = I: det(2I) = 2²·1 = 4 ≠ 2 (det(λA) = λⁿ det A)."""

# ================================================================ Domande a risposta multipla
[[item]]
id = "Q01-D1"
ref = "Domanda 1"
topic = "systems"
page = 1
task = "mcq"
text = "Sia A ∈ M_K(m, n) e sia Ax = b un sistema lineare. Selezionare le 3 affermazioni vere:"
[item.data]
options = ["b ∈ K^m", "b ∈ K^n", "Sol(A|0) ≠ ∅", "Sol(A|b) ⊆ K^n", "Sol(A|b) ⊆ K^m"]
correct = ["a", "c", "d"]
why = { a = "b has one entry per equation: m.", b = "b has m entries, not n.", c = "0 is always a solution of Ax = 0.", d = "x has one entry per unknown: n.", e = "Solutions live in K^n." }

[[item]]
id = "Q01-D2"
ref = "Domanda 2"
topic = "rank"
page = 2
task = "mcq"
text = "M′ = (1 2 0; 0 1 π; 0 0 1), M″ = (1 2 π; 0 0 1; 0 0 0). Esiste una matrice M ∈ M_R(3) di cui M′ e M″ sono due riduzioni a scala?"
[item.data]
options = ["Vero", "Falso"]
correct = "b"
why = { a = "All echelon forms of M have the same number of pivots (the rank): M′ has 3, M″ has 2.", b = "rg(M′) = 3 ≠ rg(M″) = 2, but the rank does not depend on the reduction." }

[[item]]
id = "Q01-D3"
ref = "Domanda 3"
topic = "rank"
page = 2
task = "mcq"
text = "Sia A ∈ M_K(5, 7) e b ∈ K⁵. Selezionare le 2 affermazioni vere:"
[item.data]
options = ["Se rk(A) = 5, allora il sistema lineare Ax = b è risolubile.", "Il sistema lineare Ax = b è risolubile se e solo se rk(A) = 5.", "Sol(A|b) ⊂ K⁵.", "Sol(A|b) ⊂ K⁷.", "Se b = 0, allora Sol(A|b) ha una soluzione unica."]
correct = ["a", "d"]
why = { a = "5 = rk(A) ≤ rk(A|b) ≤ 5 (only 5 rows): equal ranks ⇒ solvable.", b = "Only 'if': with rk(A) < 5 the system can still be solvable (e.g. b = 0).", c = "x has 7 components.", d = "7 unknowns.", e = "Sol(A|0) has dimension 7 − rk(A) ≥ 2." }

[[item]]
id = "Q01-D4"
ref = "Domanda 4"
topic = "inverse"
page = 2
task = "mcq"
text = "Se A è una matrice quadrata invertibile, l'unica soluzione di Ax = b è x = bA⁻¹."
[item.data]
options = ["Vero", "Falso"]
correct = "b"
why = { a = "x = A⁻¹b: multiply Ax = b on the LEFT by A⁻¹. bA⁻¹ is not even defined (b is n×1).", b = "x = A⁻¹b, not bA⁻¹ (which is not defined for a column b)." }

[[item]]
id = "Q01-D5"
ref = "Domanda 5"
topic = "rank"
page = 2
task = "mcq"
text = "Sia Ax = b un sistema lineare. Seleziona le 2 affermazioni vere:"
[item.data]
options = ["Se Ax = b non ha soluzioni, allora Ax = 0 non ha soluzioni.", "Se Ax = b ha infinite soluzioni, allora Ax = 0 ha infinite soluzioni.", "Se Ax = b ha una soluzione unica, allora Ax = 0 ha una soluzione unica."]
correct = ["b", "c"]
why = { a = "Ax = 0 always has the solution 0.", b = "Sol(A|b) = v_P + Sol(A|0) (Teorema di struttura): same 'size'.", c = "Same reason: Sol(A|0) = {0}." }

[[item]]
id = "Q01-D6"
ref = "Domanda 6"
topic = "rank"
page = 2
task = "mcq"
text = "Sia A ∈ M_K(m, n). Quale affermazione è vera per ogni b ∈ K^m?"
[item.data]
options = ["Se Ax = 0 ha infinite soluzioni, allora Ax = b ha infinite soluzioni.", "Se Ax = 0 ha una soluzione unica, allora Ax = b ha una soluzione unica.", "Se A è una matrice quadrata e Ax = 0 ha un'unica soluzione, allora Ax = b ha un'unica soluzione."]
correct = "c"
why = { a = "Ax = b may have no solution at all (e.g. x + y = 0, x + y = 1).", b = "With m > n, Ax = b may be impossible (x = 0, x = 1).", c = "Square with Ax = 0 unique ⇒ rg(A) = n ⇒ Cramer: unique solution for every b." }

[[item]]
id = "Q01-D7"
ref = "Domanda 7"
topic = "inverse"
page = 2
task = "mcq"
text = "Sia A ∈ M_K(n), b ∈ Kⁿ, e v ∈ Kⁿ l'unica soluzione di Ax = b. Selezionare le 2 affermazioni vere."
[item.data]
options = ["v = A⁻¹b.", "v = bA⁻¹.", "rk(A) > rk(A|b).", "rk(A) = n.", "Sol(A|0) ≠ {0}."]
correct = ["a", "d"]
why = { a = "Unique solution with A square ⇒ rk(A) = n ⇒ A invertible.", b = "Not defined.", c = "rk(A) ≤ rk(A|b) always.", d = "Rouché-Capelli: unique ⇔ rk(A) = rk(A|b) = n.", e = "Unique ⇔ Sol(A|0) = {0}." }

[[item]]
id = "Q01-D8"
ref = "Domanda 8"
topic = "rank"
page = 2
task = "mcq"
text = "Sia A ∈ M_K(m, n), b ∈ K^m, e v1, v2 ∈ Kⁿ soluzioni distinte di Ax = b. Selezionare le 2 affermazioni vere."
[item.data]
options = ["m < n.", "m ≥ n.", "rk(A) < n.", "rk(A|b) = m.", "Sol(A|0) ≠ {0}."]
correct = ["c", "e"]
why = { a = "Counterexample: 2x = 0, 0 = 0... any m works, e.g. 3 equations 0 = 0 in 1 unknown.", b = "Counterexample: x + y = 0 (m = 1 < n = 2).", c = "Two solutions ⇒ not unique ⇒ rk(A) < n.", d = "rk(A|b) can be smaller than m (redundant equations).", e = "v1 − v2 ≠ 0 solves Ax = 0." }

[[item]]
id = "Q01-D9"
ref = "Domanda 9"
topic = "determinant"
page = 3
task = "mcq"
text = "Siano A, B ∈ M_K(3). Allora (selezionare l'affermazione corretta):"
[item.data]
options = ["det(A + B) = det A + det B", "det(AB) = det(BA)", "AB = BA", "det(2A) = 2 det(A)."]
correct = "b"
why = { a = "False: A = B = I gives 8 ≠ 2.", b = "Binet: det(AB) = det A det B = det B det A = det(BA).", c = "The product is not commutative.", d = "det(2A) = 2³ det A." }

[[item]]
id = "Q01-D10"
ref = "Domanda 10"
topic = "determinant"
page = 3
task = "mcq"
text = "Sia A ∈ M_R(3) tale che det(A) = 3. Qual è il determinante della matrice 2A?"
[item.data]
options = ["3", "6", "9", "18", "24"]
correct = "e"
why = { e = "det(λA) = λⁿ det A = 2³·3 = 24.", b = "That would be 2·det A: the factor 2 multiplies all 3 rows." }

[[item]]
id = "Q01-D11"
ref = "Domanda 11"
topic = "determinant"
page = 3
task = "mcq"
text = "Sia A ∈ M_K(4). Se le righe di A soddisfano R1 = 2R2 + 3R3 + 4R4, allora (selezionare le 2 affermazioni corrette):"
[item.data]
options = ["det A = 10", "det A = 24", "det A = 0", "rk A < 4", "A è invertibile"]
correct = ["c", "d"]
why = { c = "Rows linearly dependent ⇒ det = 0.", d = "Dependent rows ⇒ rank < 4.", e = "det = 0 ⇒ not invertible." }

[[item]]
id = "Q01-D12"
ref = "Domanda 12"
topic = "determinant"
page = 3
task = "mcq"
text = "A = (c1, c2, c3, c4) ∈ M_R(4) con det(A) = 3 (ci colonne). Qual è il determinante di (c1 + c2, 2c2, 3c3, c4)?"
[item.data]
options = ["−3", "0", "3", "8", "18"]
correct = "e"
why = { e = "Multilinearity: det(c1 + c2, 2c2, 3c3, c4) = det(c1, 2c2, 3c3, c4) + det(c2, 2c2, 3c3, c4) = 6·3 + 0 = 18." }

[[item]]
id = "Q01-D13"
ref = "Domanda 13"
topic = "determinant"
page = 3
task = "mcq"
text = "A = (c1, c2, c3, c4) ∈ M_R(4) con det(A) = 1. Qual è il determinante di (c2, c3, 2c1 + 3c4, c4)?"
[item.data]
options = ["2", "−2", "6", "0", "1"]
correct = "a"
why = { a = "= 2 det(c2, c3, c1, c4) + 3 det(c2, c3, c4, c4) = 2 det(c2, c3, c1, c4) + 0; (c2, c3, c1) is a 3-cycle = 2 swaps ⇒ sign +1 ⇒ 2.", b = "A 3-cycle is an EVEN permutation (two transpositions): no sign change." }

[[item]]
id = "Q01-D14"
ref = "Domanda 14"
topic = "determinant"
page = 3
task = "mcq"
text = "Sia A ∈ M_K(n) una matrice triangolare superiore. Quale delle seguenti affermazioni è sicuramente vera?"
[item.data]
options = ["A è invertibile.", "det(A) = 0.", "rk(A) = n.", "Nessuna delle altre."]
correct = "d"
why = { a = "det A = product of the diagonal entries, which may vanish.", b = "I is upper triangular with det 1.", c = "O is upper triangular with rank 0.", d = "det A = a11·a22···ann can be anything." }
