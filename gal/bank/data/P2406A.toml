[[item]]
id = "P2406A-E1c"
ref = "Esercizio 1 c)"
section = "II"
points = 2
topic = "scalar_products"
page = 2
task = "open"
text = "c) Dimostrare che ⟨u, v⟩ è un prodotto scalare."
[item.data]
solution = """
Bilinear (it is uᵀMv), symmetric (M = Mᵀ), positive definite: q(x) = (x1 − x2)² + x2² + x3² > 0 for x ≠ 0 (or: leading minors 1, 1, 1 > 0)."""


