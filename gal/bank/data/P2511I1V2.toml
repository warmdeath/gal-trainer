[[item]]
id = "P2511I1V2-D1"
ref = "Domanda 1"
section = "I"
points = 1
topic = "inverse"
page = 1
task = "mcq"
text = "Dati i parametri a, b, c ∈ R, il sistema lineare { −x − 2y + z = a;  x − y = b;  2x + 2y − z = c } ha soluzione"
[item.data]
options = ["(−1 −2 1; 1 −1 0; 2 2 −1)(a, b, c)ᵀ", "(1 1 4; 0 −1 −3; 1 1 3)(a, b, c)ᵀ", "(1 0 1; 1 −1 1; 4 −2 3)(a, b, c)ᵀ", "la soluzione non esiste per ogni a, b, c."]
correct = "c"
why = "A = (−1 −2 1; 1 −1 0; 2 2 −1) is invertible and A⁻¹ = (1 0 1; 1 −1 1; 4 −2 3): the unique solution is A⁻¹(a, b, c)ᵀ."

[[item]]
id = "P2511I1V2-D2"
ref = "Domanda 2"
section = "I"
points = 1
topic = "rep_matrix"
page = 1
task = "mcq"
text = "Sia f: M_R(2, 2) → R[x]_≤2 l'applicazione lineare f((a b; c d)) = (a + c) − (b + d)x. La matrice rappresentativa di f rispetto alla base B = {E11, E12, E21, E22} di M_R(2, 2) e alla base C = {1 + x², x, 1 − x²} di R[x]_≤2 è"
[item.data]
options = ["(1/2 0 0 1/2; 0 −1 −1 0; 1/2 0 0 1/2)", "(1/2 0 1/2 0; 0 −1 0 −1; 1/2 0 1/2 0)", "(1 −1; −1 1)", "(1/2 0 1/2; 0 −1 0; 0 −1 0; 1/2 0 1/2)"]
correct = "b"
why = "f(E11) = f(E21) = 1 = ½(1 + x²) + ½(1 − x²) → (1/2, 0, 1/2); f(E12) = f(E22) = −x → (0, −1, 0)."

[[item]]
id = "P2511I1V2-D3"
ref = "Domanda 3"
section = "I"
points = 1
topic = "matrices"
page = 1
task = "mcq"
text = "Date due matrici A ∈ M_K(3, 2) e B ∈ M_K(3, 4), quale delle seguenti matrici è definita?"
[item.data]
options = ["ABᵀ", "AᵀBᵀ", "BᵀAᵀ", "BᵀA"]
correct = "d"
why = "Bᵀ ∈ M(4, 3) and A ∈ M(3, 2): BᵀA ∈ M(4, 2) is the only product with matching sizes."

[[item]]
id = "P2511I1V2-D4"
ref = "Domanda 4"
section = "I"
points = 1
topic = "linear_maps"
page = 1
task = "mcq"
text = "Data un'applicazione lineare L: R[t]_≤3 → Mat_R(2, 3) allora sicuramente"
[item.data]
options = ["L è iniettiva", "L non è iniettiva", "L è suriettiva", "L non è suriettiva"]
correct = "d"
why = "dim Im L ≤ dim R[t]_≤3 = 4 < 6 = dim Mat_R(2, 3): L can never be surjective (it may or may not be injective)."

