[[item]]
id = "P2601I2V1-E2iii"
ref = "Esercizio 2 iii)"
section = "II"
points = 2.2
topic = "projections"
page = 3
task = "open"
text = "iii) Si trovino nucleo e immagine della proiezione ortogonale π_W: R⁴ → R⁴ e si spieghi perché sono autospazi di π_W."
[item.data]
solution = """
ker π_W = W⊥ (π_W(v) = 0 ⇔ v ⊥ W): it is the eigenspace V_0. Im π_W = W, since π_W(v) ∈ W for all v and π_W(w) = w for w ∈ W:
W ⊆ V_1, and since R⁴ = W ⊕ W⊥ the eigenspace V_1 cannot be bigger, so V_1 = W = Im π_W."""

[[item]]
id = "P2601I2V1-E2iv"
ref = "Esercizio 2 iv)"
section = "II"
points = 2.2
topic = "isometries"
page = 3
task = "open"
text = "iv) Si usino le informazioni al punto iii) per concludere che π_W è un endomorfismo simmetrico."
[item.data]
solution = """
An orthogonal basis B0 of W⊥ together with an orthogonal basis B1 of W (Gram-Schmidt) is an orthogonal basis of R⁴ made of
eigenvectors of π_W. So π_W is orthogonally diagonalisable, hence symmetric by the spectral theorem."""

