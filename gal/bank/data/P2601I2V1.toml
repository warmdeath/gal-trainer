[[item]]
id = "P2601I2V1-E3iii"
ref = "Esercizio 3 iii)"
section = "II"
points = 2.2
topic = "rep_matrix"
page = 3
task = "open"
text = "iii) Sia f: V → V l'applicazione lineare la cui matrice rappresentativa rispetto alla base B è M^B_B(f) = A. Si determinino il nucleo e l'immagine di f."
[item.data]
solution = """
The vectors of ii) are B-coordinates. ker A = Span((1, −1, 1, 0), (0, −1, 0, 1)), so
ker f = Span(B1 − B2 + B3, −B2 + B4) = Span((1 −1; −1 1), (0 0; −2 0)).
Col A = Span((1, 0, 1, 0), (1, 1, 2, 1)), so Im f = Span(B1 + B3, B1 + B2 + 2B3 + B4) = Span((1 0; 0 1), (2 2; 0 1))."""
