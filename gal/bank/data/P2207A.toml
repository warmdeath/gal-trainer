task = "values"
setup = "Sia Q ⊆ R³ la quadrica 5x1² + 5x2² + 2x3² + 2x1x2 + 2x1 − 2 = 0."
text = "1. Verificare se Q è a centro, ed eventualmente calcolarne le coordinate."
data = { answers = [["x1 of the centre", "-5/24"], ["x2 of the centre", "1/24"], ["x3 of the centre", 0]], why = "A = (5 1 0; 1 5 0; 0 0 2) is invertible (det 48): a unique centre, Ac = −(1, 0, 0) ⇒ c = (−5/24, 1/24, 0)." }


[[item]]
id = "P2207A-E3b"
ref = "Esercizio 3.2"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
text = "2. Classificare metricamente Q."
[item.data]
solution = """
Eigenvalues 6 ((1, 1, 0)), 4 ((1, −1, 0)), 2 ((0, 0, 1)); at the centre the constant is bᵀc − 2 = −53/24. Metric form 6X² + 4Y² + 2Z² = 53/24: a real ellipsoid (three distinct semi-axes)."""


[[item]]
id = "P2207A-E3c"
ref = "Esercizio 3.3"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
text = "3. Determinare una parametrizzazione degli assi di simmetria di Q (nelle coordinate x1, x2, x3)."
[item.data]
solution = """
Through the centre c = (−5/24, 1/24, 0) along the eigenvectors: c + t(1, 1, 0), c + t(1, −1, 0), c + t(0, 0, 1)."""
