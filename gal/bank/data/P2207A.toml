[[item]]
id = "P2207A-E2a"
ref = "Esercizio 2.1"
section = "II"
points = 2
topic = "diagonalization"
page = 3
task = "open"
setup = "Siano v1 = (1, 0, 2), v2 = (1, 1, 0), v3 = (1, 0, 1) e L: R³ → R³ con L(v1) = v1, L(v2) = v2, L(v3) = 0."
text = "1. Dimostrare che B = {v1, v2, v3} è una base di R³ e determinare la matrice di L rispetto a B. L è diagonalizzabile? L è ortogonalmente diagonalizzabile?"
[item.data]
solution = """
det(v1 | v2 | v3) = −1 ≠ 0: B is a basis. M^B_B(L) = diag(1, 1, 0): L is diagonalisable (B is an eigenbasis). Not orthogonally: V_1 = Span(v1, v2) and V_0 = Span(v3) are not orthogonal (⟨v1, v3⟩ = 3 ≠ 0)."""


