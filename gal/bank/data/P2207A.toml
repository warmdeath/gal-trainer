[[item]]
id = "P2207A-E2c"
ref = "Esercizio 2.3"
section = "II"
points = 2
topic = "linear_maps"
page = 3
task = "open"
text = "3. Al variare di t ∈ R, sia u_t = (1 − t, −2 + 2t, 3 − 3t)ᵀ. Determinare L⁻¹(u_t) = {v : L(v) = u_t}."
[item.data]
solution = """
u_t = (1 − t)(1, −2, 3) and Im L = Span(v1, v2) = V_1 does not contain (1, −2, 3) (rank of v1, v2, (1,−2,3) is 3). So L⁻¹(u_t) = ∅ for t ≠ 1; for t = 1, u_1 = 0 and L⁻¹(0) = ker L = Span(v3) = Span((1, 0, 1))."""


[[item]]
id = "P2207A-E3a"
