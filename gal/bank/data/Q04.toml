[[item]]
id = "Q04-D1"
ref = "Domanda 1"
topic = "eigen"
page = 2
task = "mcq"
text = "Data A ∈ M_K(n), quali delle seguenti affermazioni sono vere? (2 risposte corrette)"
[item.data]
options = ["Se A è invertibile, allora è diagonalizzabile.", "A ha al massimo n autovalori distinti.", "Se A è una matrice triangolare inferiore/superiore, allora gli autovalori di A sono gli elementi sulla diagonale.", "Se A è diagonalizzabile, allora è invertibile."]
correct = ["b", "c"]
why = { a = "(1 1; 0 1) is invertible, not diagonalisable.", b = "They are roots of p_A, of degree n.", c = "p_A(t) = Π(t − a_ii) for triangular A.", d = "O is diagonal and not invertible." }

[[item]]
id = "Q04-D2"
ref = "Domanda 2"
topic = "eigen"
page = 2
task = "mcq"
text = "A ∈ M_K(2), u autovettore di autovalore −2, v autovettore di autovalore 1. Allora A³(v + u) = ?"
[item.data]
options = ["8u − v", "−8u + v", "8u + v", "−8u − v"]
correct = "b"
why = { b = "A³u = (−2)³u = −8u and A³v = v." }

[[item]]
id = "Q04-D3"
ref = "Domanda 3"
topic = "eigen"
page = 2
task = "mcq"
text = "Le matrici A = (2 2; 1 3) e B = (1 0; k 2k) hanno gli stessi autovalori per:"
[item.data]
options = ["k = −2", "k = −1", "k = 2", "k = 1", "k = 0"]
correct = "c"
why = { c = "p_A = t² − 5t + 4 = (t − 1)(t − 4); B is triangular with eigenvalues 1 and 2k: 2k = 4." }

[[item]]
id = "Q04-D4"
ref = "Domanda 4"
topic = "eigen"
page = 2
task = "mcq"
text = "Siano v, w ∈ V autovettori dell'endomorfismo f: V → V. Quale affermazione è sicuramente vera?"
[item.data]
options = ["v + w è un autovettore.", "Se f(v) = 2v e f(w) = 4w, allora f(v + w) = 6(v + w).", "Se f(v) = 2v e f(w) = 4w, allora f(v + w) = 3(v + w).", "Se f(v) = 2v e f(w) = 2w, allora f(v + w) = 2(v + w).", "Se f(v) = 2v e f(w) = 2w, allora f(v + w) = 4(v + w)."]
correct = "d"
why = { a = "v + w may be 0, or a sum of eigenvectors of different eigenvalues (not an eigenvector).", b = "f(v + w) = 2v + 4w.", c = "f(v + w) = 2v + 4w, not a multiple of v + w.", d = "Eigenspaces are subspaces: f(v + w) = 2v + 2w.", e = "It is 2(v + w)." }

[[item]]
id = "Q04-D5"
ref = "Domanda 5"
topic = "eigen"
page = 2
task = "mcq"
text = "Sia A ∈ M_K(n) e λ ∈ K un autovalore di A. Quali delle seguenti affermazioni sono vere? (3 risposte corrette)"
[item.data]
options = ["Se λ = 0, allora rg(A) < n.", "Se A è invertibile e diagonalizzabile, allora A⁻¹ è diagonalizzabile.", "Se λ = 0, allora det A ≠ 0.", "Se rg(A) < n, allora A è diagonalizzabile.", "Se det(A) = 0, allora 0 è un autovalore di A."]
correct = ["a", "b", "e"]
why = { a = "0 eigenvalue ⇔ ker A ≠ {0}.", b = "P⁻¹AP = D ⇒ P⁻¹A⁻¹P = D⁻¹.", c = "0 eigenvalue ⇒ det A = 0.", d = "(0 1; 0 0).", e = "det A = 0 ⇔ ker A ≠ {0}." }

[[item]]
id = "Q04-D6"
ref = "Domanda 6"
topic = "diagonalization"
page = 3
task = "mcq"
text = "Sia A ∈ M_C(4). Quale delle seguenti affermazioni è vera? (1 risposta corretta)"
[item.data]
options = ["Se A ha 4 autovettori distinti, allora è diagonalizzabile.", "A è diagonalizzabile se e solo se ma(λ) = mg(λ) per ogni autovalore λ di A.", "Se A ha un unico autovalore, allora A è un multiplo della matrice identità I4.", "Se tutte le radici del polinomio caratteristico di A sono numeri reali, allora A è diagonalizzabile.", "Se A è diagonalizzabile, allora ha un autovalore semplice."]
correct = "b"
why = { a = "v, 2v, 3v, 4v are distinct eigenvectors.", b = "Over C, Σ ma = 4 always, so the 2° criterio reduces to ma = mg.", c = "I4 + E12 has the single eigenvalue 1.", d = "(1 1; 0 1) ⊕ I2.", e = "I4." }

