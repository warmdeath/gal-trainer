setup = "Nello spazio vettoriale V = R³ si consideri la forma bilineare ⟨·,·⟩: V × V → R, ⟨x, y⟩ = xᵀAy, dove A = (2 1 0; 1 2 1; 0 1 2). Si denoti con E = {e1, e2, e3} la base canonica di R³."
text = "i) Calcolare ⟨e1, e2⟩, ⟨e2, e3⟩, √⟨e1, e1⟩, √⟨e2, e2⟩."
[item.data]
answers = [["⟨e1, e2⟩", 1], ["⟨e2, e3⟩", 1], ["√⟨e1, e1⟩", "sqrt(2)"], ["√⟨e2, e2⟩", "sqrt(2)"]]
why = "⟨ei, ej⟩ = eiᵀAej = a_ij: ⟨e1, e2⟩ = a12 = 1, ⟨e2, e3⟩ = a23 = 1, ⟨e1, e1⟩ = a11 = 2, ⟨e2, e2⟩ = a22 = 2."

