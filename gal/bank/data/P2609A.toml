# ================================================================ Parte I
[[item]]
id = "P2609A-D1"
ref = "Domanda 1"
section = "I"
points = 1
topic = "sum_intersection"
page = 1
task = "mcq"
text = "Per tutti i sottospazi vettoriali U, W ⊲ R⁶ con U + W = R⁶ e dim U = dim W vale:"
[item.data]
options = ["dim(U ∩ W) è un numero pari", "dim(U ∩ W) = 0", "dim(U ∩ W) = 1", "dim(U ∩ W) è un numero dispari"]
correct = "a"
why = "Grassmann: dim(U ∩ W) = dim U + dim W − dim(U + W) = 2·dim U − 6, always even (e.g. 0 if dim U = 3, 2 if dim U = 4)."

[[item]]
id = "P2609A-D2"
ref = "Domanda 2"
section = "I"
points = 1
topic = "bases"
page = 1
task = "mcq"
text = "Nello spazio R[x]_≤2, il vettore (p)_B delle coordinate di p(x) = 3 + x + 2x² rispetto alla base B = {1 + x, x + x², 1 + x²} è:"
[item.data]
options = ["(1, 0, 2)ᵀ", "(3, 1, 2)ᵀ", "(1, 1, 1)ᵀ", "(2, −1, 2)ᵀ"]
correct = "a"
why = "a(1 + x) + b(x + x²) + c(1 + x²) = 3 + x + 2x² ⇔ a + c = 3, a + b = 1, b + c = 2 ⇔ (a, b, c) = (1, 0, 2)."

[[item]]
id = "P2609A-D3"
ref = "Domanda 3"
section = "I"
points = 1
topic = "scalar_products"
page = 1
task = "mcq"
text = "In R² con prodotto scalare ⟨(x1, x2)ᵀ, (y1, y2)ᵀ⟩ = x1y1 + 2x2y2, la norma del vettore (1, 1)ᵀ è:"
[item.data]
options = ["3", "√3", "√2", "1"]
correct = "b"
why = "‖(1, 1)‖² = 1·1 + 2·1·1 = 3, so the norm is √3."

[[item]]
id = "P2609A-D4"
ref = "Domanda 4"
section = "I"
points = 1
topic = "rank"
page = 1
task = "mcq"
text = "Il sistema lineare (1 1; 2 2; 3 3) x = (2, k, 6)ᵀ è risolubile"
[item.data]
options = ["se e solo se k = 4", "se e solo se k = 2", "per ogni k ∈ R", "per nessun k ∈ R"]
correct = "a"
why = "rg(A) = 1; the complete matrix has rank 1 iff (2, k, 6) is proportional to (1, 2, 3), i.e. k = 4 (Rouché-Capelli)."

[[item]]
id = "P2609A-D5"
ref = "Domanda 5"
section = "I"
points = 1
topic = "bases"
page = 1
task = "mcq"
text = "Tutti i sottospazi vettoriali U di R⁵ che contengono 3 vettori linearmente indipendenti soddisfano"
[item.data]
options = ["dim U ≥ 2", "dim U ≤ 4", "dim U = 3", "dim U ≤ 3"]
correct = "a"
why = "3 independent vectors in U give dim U ≥ 3, hence also dim U ≥ 2. dim U can be 3, 4 or 5, so B, C, D can fail."

[[item]]
id = "P2609A-D6"
ref = "Domanda 6"
section = "I"
points = 1
topic = "affine"
page = 1
task = "mcq"
text = "L'insieme U = {(x, y, z) ∈ R³ : x + y = 1, y + z = 2} è:"
[item.data]
options = ["un sottospazio vettoriale di dimensione 1", "una retta affine", "un piano affine", "vuoto"]
correct = "b"
why = "Two independent non-homogeneous equations in R³: a consistent system with ∞¹ solutions, a line not through 0."

[[item]]
id = "P2609A-D7"
ref = "Domanda 7"
section = "I"
points = 1
topic = "determinant"
page = 2
task = "mcq"
text = "Siano v1, v2, v3 ∈ R³ tali che det(v1 | v2 | v3) = 3. Allora det(2v1 | 2v2 + v1 | 2v3 − v2) è"
[item.data]
options = ["24", "6", "3", "0"]
correct = "a"
why = "Multilinearity and alternance: the added multiples of earlier columns do not change det, so det = 2·2·2·3 = 24."

[[item]]
id = "P2609A-D8"
ref = "Domanda 8"
section = "I"
points = 1
topic = "isometries"
page = 2
task = "mcq"
text = "La forma quadratica φ: R³ → R associata alla matrice A = (1 0 0; 0 0 1; 0 1 0) è:"
[item.data]
options = ["indefinita", "semidefinita positiva", "definita positiva", "definita negativa"]
correct = "a"
why = "Eigenvalues 1, 1, −1 (the block (0 1; 1 0) has ±1): of both signs, so φ is indefinite (φ(0,1,−1) = −2 < 0 < φ(1,0,0))."

[[item]]
id = "P2609A-D9"
ref = "Domanda 9"
section = "I"
points = 1
topic = "linear_maps"
page = 2
task = "mcq"
text = "Sia D: R[x]_≤3 → R[x]_≤3 la derivazione D(p) = p′. Allora:"
[item.data]
options = ["dim ker(D) = 1", "dim Im(D) = 2", "D è iniettiva", "D è suriettiva"]
correct = "a"
why = "ker D = constants (dim 1); Im D = R[x]_≤2 (dim 3): D is neither injective nor surjective."

[[item]]
id = "P2609A-D10"
ref = "Domanda 10"
section = "I"
points = 1
topic = "diagonalization"
page = 2
task = "mcq"
text = "Due matrici simili A, B ∈ M_R(5, 5) hanno necessariamente:"
[item.data]
options = ["lo stesso polinomio caratteristico e lo stesso rango", "le stesse entrate sulla diagonale", "lo stesso polinomio caratteristico, ma possono avere rango diverso", "gli stessi autovettori"]
correct = "a"
why = "B = P⁻¹AP: p_B = p_A and rg B = rg A (P invertible). Diagonals and eigenvectors change in general (only the trace is preserved)."

