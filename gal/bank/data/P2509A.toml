data = { U = { A = [[-1, 1, 1]] }, W = { span = [[-1, 1, 0], [0, 0, 1]] }, names = ["a", "b", "c"], parts = ["int_basis", "dim_int", "sum_basis", "dim_sum"] }


[[item]]
id = "P2509A-E2c"
ref = "Esercizio 2 c)"
section = "II"
points = 2
topic = "sum_intersection"
page = 3
task = "open"
text = "c) Scrivere (se possibile) il polinomio p(t) = t come somma di un polinomio in U e di un polinomio in W. Può essere scritto in modo unico? Perché?"
[item.data]
solution = """
U + W = R[t]_≤2, so it is possible: e.g. t = (t − t²) + t², with t − t² ∈ U (p(1) = 0 = 2p(0)) and t² ∈ W.
Not unique: U ∩ W = Span(−1 + t − 2t²) ≠ {0} (the sum is not direct); adding any element of U ∩ W to the first summand and subtracting it from the second gives another decomposition."""


[[item]]
id = "P2509A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 3
topic = "conics"
page = 4
task = "open"
setup = "In R² considerare il punto F = (5/4, 5/4) e la retta r = {(x, y) ∈ R² : y + x − 3/2 = 0}, e il luogo C = {x ∈ R² : d(x, F) = d(x, r)}."
text = "a) Dimostrare che C è una conica di equazione x² + y² − 2xy − 2x − 2y + 4 = 0."
[item.data]
solution = """
d(x, F)² = (x − 5/4)² + (y − 5/4)², d(x, r)² = (x + y − 3/2)²/2. Equating and multiplying by 2:
2x² + 2y² − 5x − 5y + 25/4 = x² + y² + 2xy − 3x − 3y + 9/4, i.e. x² + y² − 2xy − 2x − 2y + 4 = 0."""


[[item]]
id = "P2509A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 2
topic = "conics"
page = 4
task = "open"
text = "b) Trovare la forma canonica metrica e classificare la conica C."
[item.data]
solution = """
A = (1 −1; −1 1) has eigenvalues 2 and 0: parabolic type; the complete 3 × 3 matrix is invertible, so C is a non-degenerate parabola. b′ = π_kerA(b) = −(1, 1), ‖b′‖ = √2: canonical form 2z1² + 2√2 z2 = 0, i.e. z1² = −√2 z2 (focus–directrix distance p = d(F, r) = √2/2, y² = 2px)."""


[[item]]
id = "P2509A-E3c"
ref = "Esercizio 3 c)"
section = "II"
points = 2
topic = "conics"
page = 4
task = "open"
text = "c) Determinare l'equazione dell'asse di simmetria e del vertice di C."
[item.data]
solution = """
The axis is the line through F orthogonal to r: x − y = 0. The vertex is the midpoint of F and its projection (3/4, 3/4) on r: V = (1, 1) (indeed 1 + 1 − 2 − 2 − 2 + 4 = 0)."""
