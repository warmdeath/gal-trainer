page = 2
task = "yesno"
text = "c) Esiste una matrice A ∈ Mat_R(2, 2) tale che rk(A) ≠ rk(T(A))?"
data = { answer = false, why = "No: multiplying by invertible matrices does not change the rank (A and CAC⁻¹ are similar), so rk(T(A)) = rk(A) for every A." }


[[item]]
id = "P2509A-E2a"
ref = "Esercizio 2 a)"
