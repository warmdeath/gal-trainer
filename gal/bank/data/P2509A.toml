task = "grassmann"
setup = "In R[t]_≤2 considerare i sottospazi U = {p(t) ∈ R[t]_≤2 : p(1) = 2p(0)} e W = Span{t − 1, t²}. (Coordinates w.r.t. {1, t, t²}: p = a + bt + ct² ∈ U ⇔ −a + b + c = 0.)"
text = "a) Determinare una base e la dimensione di U e W."
data = { U = { A = [[-1, 1, 1]] }, W = { span = [[-1, 1, 0], [0, 0, 1]] }, names = ["a", "b", "c"], parts = ["U", "W"] }


[[item]]
