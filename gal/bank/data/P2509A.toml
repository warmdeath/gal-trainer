task = "mcq"
text = "La segnatura della forma quadratica q(x, y) = x² − 2xy − 2y²"
[item.data]
options = ["è (1, 1, 0)", "è (1, 0, 1)", "è (2, 0, 0)", "è (0, 2, 0)"]
correct = "a"
why = "Matrix (1 −1; −1 −2) has det −3 < 0: one positive and one negative eigenvalue, (1, 1, 0)."


[[item]]
id = "P2509A-D12"
ref = "Parte A, domanda 12"
section = "I"
points = 1
topic = "conics"
page = 1
task = "mcq"
text = "La conica C: x² + y² + 2x + 1 = 0"
[item.data]
options = ["ha un unico centro", "ha infiniti centri", "è senza centro", "nessuna delle precedenti"]
correct = "a"
why = "(x + 1)² + y² = 0: the quadratic part is invertible (I), so there is exactly one centre, (−1, 0) (the conic reduces to that single point)."


[[item]]
id = "P2509A-E1a"
ref = "Esercizio 1 a)"
section = "II"
points = 2
topic = "linear_maps"
page = 2
task = "open"
setup = "Si consideri l'applicazione T: Mat_R(2, 2) → Mat_R(2, 2) definita da T(A) = CAC⁻¹, dove C = (1 2; 0 −1)."
text = "a) Dimostrare che T è un'applicazione lineare."
[item.data]
solution = """
T(αA + βB) = C(αA + βB)C⁻¹ = αCAC⁻¹ + βCBC⁻¹ = αT(A) + βT(B), by distributivity of the matrix product."""


[[item]]
id = "P2509A-E1b"
ref = "Esercizio 1 b)"
section = "II"
points = 2
topic = "linear_maps"
page = 2
task = "yesno"
text = "b) Stabilire se T è iniettiva."
data = { answer = true, why = "T(A) = O ⇒ CAC⁻¹ = O ⇒ A = C⁻¹OC = O: ker T = {O}. (T is even invertible, with inverse B ↦ C⁻¹BC; here C⁻¹ = C.)" }


[[item]]
id = "P2509A-E1c"
