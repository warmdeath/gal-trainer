[[item]]
id = "P2402A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
text = "b) Il luogo dei punti equidistanti da entrambe è la quadrica Q = {x ∈ R³ : 2x1² − x2² − x3² − 2x2x3 − 4x3 − 2 = 0} (non è richiesta la verifica). Classificare affinemente Q."
[item.data]
solution = """
Quadratic part (2 0 0; 0 −1 −1; 0 −1 −1): eigenvalues 2, −2, 0 (rank 2, opposite signs); the complete 4 × 4 matrix has det 8 ≠ 0. With u = x2 + x3, v = x2 − x3: 2x1² − (u + 1)² + 2v − 1 = 0, linear in v: a hyperbolic paraboloid."""


