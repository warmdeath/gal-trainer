[[item]]
id = "P2402A-E1b"
ref = "Esercizio 1 b)"
section = "II"
points = 3
topic = "rep_matrix"
page = 2
task = "open"
text = "b) Determinare la matrice rappresentativa di L_k rispetto alle basi B = {x + 1, x} e C = {(1, 1), (2, 1)}."
[item.data]
solution = """
L_k(x + 1) = (3, k) = (2k − 3)(1, 1) + (3 − k)(2, 1); L_k(x) = (2, k) = (2k − 2)(1, 1) + (2 − k)(2, 1).
M^B_C(L_k) = (2k − 3  2k − 2; 3 − k  2 − k)."""


