# ================================================================ Parte I
[[item]]
id = "P2606A-D1"
ref = "Domanda 1"
section = "I"
points = 1
topic = "systems"
page = 1
task = "mcq"
text = "Il sistema lineare { −y + 2z + 6w = 0;  6x + 2y + 4z + 8w = 2;  y − 2z − 6w = 0;  3x + y + 2z + 4w = −1 }"
[item.data]
options = ["non ha soluzione.", "ha un'unica soluzione.", "ha infinite soluzioni dipendenti da 2 parametri.", "ha infinite soluzioni dipendenti da 4 parametri."]
correct = "a"
why = "Equation 2 is twice the left side of equation 4, but 2 ≠ 2·(−1): the system is inconsistent (rg(A) = 2 < rg(A|b) = 3)."

[[item]]
id = "P2606A-D2"
ref = "Domanda 2"
section = "I"
points = 1
topic = "isometries"
page = 1
task = "mcq"
text = "La forma quadratica q_A(x, y, z) associata alla matrice A = (π e −√3; e −π 0; −√3 0 −1) ha segnatura:"
[item.data]
options = ["(2, 1, 0).", "(1, 2, 0).", "(1, 1, 1).", "(0, 3, 0)."]
correct = "b"
why = "Leading principal minors: D1 = π > 0, D2 = −π² − e² < 0, D3 = det A = π² + e² + 3π > 0. Signs of D1, D2/D1, D3/D2 are +, −, −: one positive and two negative eigenvalues, none zero, so the signature (n+, n−, n0) is (1, 2, 0)."

[[item]]
id = "P2606A-D3"
ref = "Domanda 3"
section = "I"
points = 1
topic = "scalar_products"
page = 1
task = "mcq"
text = "Sia (V, ⟨·,·⟩) uno spazio euclideo. Quale delle seguenti vale per ogni v, w ∈ V?"
[item.data]
options = ["⟨v, w⟩ ≤ ‖v‖·‖w‖", "‖v‖² + ‖w‖² = ‖v + w‖²", "‖v‖ + ‖w‖ ≤ ‖v + w‖", "‖v‖ − ‖w‖ = ⟨v, w⟩"]
correct = "a"
why = "Cauchy-Schwarz: |⟨v, w⟩| ≤ ‖v‖‖w‖. B is Pythagoras (only for v ⊥ w), C is the triangle inequality reversed."

[[item]]
id = "P2606A-D4"
ref = "Domanda 4"
section = "I"
points = 1
topic = "bases"
page = 1
task = "mcq"
text = "Nello spazio vettoriale V = R[x]_≤3 dei polinomi P(x) = a + bx + cx² + dx³, sia W il sottospazio definito da a + b + c + d = a − b + c − d = b + d = 0. Una base di W è"
[item.data]
options = ["{1 − x², x − x³}.", "{1 − x³, x − x²}.", "{1 + x + x² + x³, 1 − x + x² − x³, x + x³}", "la base canonica di V."]
correct = "a"
why = "The equations give a + c = 0 and b + d = 0 (rank 2), so dim W = 2 and W = {a(1 − x²) + b(x − x³)}: 1 − x² and x − x³ satisfy all three equations and are independent."

[[item]]
id = "P2606A-D5"
ref = "Domanda 5"
section = "I"
points = 1
topic = "vector_spaces"
page = 1
task = "mcq"
text = "Nello spazio vettoriale R³, l'insieme U := {(x, y, z)ᵀ ∈ R³ | x² + y² − 2x + 1 = 0}"
[item.data]
options = ["è vuoto.", "ha un solo elemento.", "è un sottospazio vettoriale di dimensione 1.", "è contenuto in un sottospazio vettoriale di dimensione 2."]
correct = "d"
why = "x² + y² − 2x + 1 = (x − 1)² + y² = 0 ⇔ x = 1, y = 0: U is the line {(1, 0, z)}, which does not pass through 0 (not a subspace) but lies in the plane Span((1,0,0), (0,0,1))."

[[item]]
id = "P2606A-D6"
ref = "Domanda 6"
section = "I"
points = 1
topic = "linear_maps"
page = 2
task = "mcq"
text = "Sia L_A: R³ → R³ l'applicazione lineare associata alla matrice A = (1 1 1; 0 1 0; 1 0 1). Allora:"
[item.data]
options = ["l'applicazione L_A è invertibile.", "l'immagine di L_A è una retta.", "il nucleo di L_A è un piano.", "nessuna delle altre risposte è corretta."]
correct = "d"
why = "det A = 0 and rg A = 2: L_A is not invertible, Im L_A is a plane and ker L_A = Span((1, 0, −1)) is a line."

[[item]]
id = "P2606A-D7"
ref = "Domanda 7"
section = "I"
points = 1
topic = "isometries"
page = 2
task = "mcq"
text = "Sia A ∈ M_R(2, 2) una matrice simmetrica di rango 1. Se v = (1, 2)ᵀ è autovettore di A associato all'autovalore λ1 = 2, allora:"
[item.data]
options = ["esiste un secondo autovalore λ2 < 0.", "ker(A) = Span((4, −2)ᵀ).", "mg(λ1) = 2.", "Im(A) = R²."]
correct = "b"
why = "Rank 1 ⇒ the other eigenvalue is 0 and ker A = V_0. A symmetric ⇒ eigenspaces are orthogonal: V_0 = Span(v)⊥ = Span((2, −1)) = Span((4, −2))."

[[item]]
id = "P2606A-D8"
ref = "Domanda 8"
section = "I"
points = 1
topic = "matrices"
page = 2
task = "mcq"
text = "Sia M ∈ M_R(n, n). Quale delle seguenti matrici è sicuramente simmetrica?"
[item.data]
options = ["M²", "M − Mᵀ", "MMᵀ", "AᵀMA, con A ∈ M_R(n, n)"]
correct = "c"
why = "(MMᵀ)ᵀ = (Mᵀ)ᵀMᵀ = MMᵀ. M − Mᵀ is antisymmetric; M² and AᵀMA are symmetric only if M is."

[[item]]
id = "P2606A-D9"
ref = "Domanda 9"
section = "I"
points = 1
topic = "affine"
page = 2
task = "mcq"
text = "Il sottospazio affine S = {(x, y, z, w)ᵀ ∈ R⁴ | x + y + z + w − 1 = x − y − z + w − 1 = y + z = 0} ha equazioni parametriche"
[item.data]
options = ["S: (x, y, z, w)ᵀ = (0, 0, 1, 0)ᵀ + t1(1, 0, 0, −1)ᵀ + t2(0, 1, −1, 0)ᵀ.", "S: (x, y, z, w)ᵀ = (0, 0, 0, 1)ᵀ + t1(1, 1, −1, −1)ᵀ.", "S: (x, y, z, w)ᵀ = (1, 0, 0, 0)ᵀ + t1(1, 1, −1, −1)ᵀ + t2(1, −1, 1, −1)ᵀ.", "S: (x, y, z, w)ᵀ = (1, 1, 0, −1)ᵀ + t1(1, 1, 1, 1)ᵀ + t2(1, −1, −1, 1)ᵀ + t3(0, 1, 1, 0)ᵀ."]
correct = "c"
why = "The equations reduce to x + w = 1, y + z = 0 (rank 2): S has dimension 2 and contains (1, 0, 0, 0); (1, 1, −1, −1) and (1, −1, 1, −1) solve the homogeneous system and are independent. A: (0,0,1,0) ∉ S."

[[item]]
id = "P2606A-D10"
ref = "Domanda 10"
section = "I"
points = 1
topic = "cross_distances"
page = 2
task = "mcq"
text = "In R⁴ con il prodotto scalare standard, la distanza del punto P = (1, 0, 1, 0)ᵀ dall'iperpiano affine {x + y + z + w = −1} è:"
[item.data]
options = ["1/2.", "3/2.", "0.", "1."]
correct = "b"
why = "d = |1 + 0 + 1 + 0 + 1| / ‖(1, 1, 1, 1)‖ = 3/2."

