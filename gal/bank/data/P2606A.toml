[[item]]
id = "P2606A-E3iv"
ref = "Esercizio 3 iv)"
section = "II"
points = 2.2
topic = "isometries"
page = 3
task = "open"
text = "iv) Sia v3 ∈ H⊥ tale che ‖v3‖ = 2. Si decida se esiste un'isometria lineare f: R⁴ → R⁴ tale che f(v1) = v2, f(v2) = v3."
[item.data]
solution = """
No. A linear isometry preserves scalar products: ⟨v1, v2⟩ = ⟨f(v1), f(v2)⟩ = ⟨v2, v3⟩ = 0 since v2 ∈ H and v3 ∈ H⊥.
But ⟨v1, v2⟩ = 1 + 1 + 1 − 1 = 2 ≠ 0: contradiction, so no such f exists (even though all the norms are 2)."""
