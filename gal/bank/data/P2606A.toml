[[item]]
id = "P2606A-E2i"
ref = "Esercizio 2 i)"
section = "II"
points = 2.2
topic = "vector_spaces"
page = 3
task = "open"
setup = "Sia V := M_R(3, 3), e si considerino i sottoinsiemi S := {M ∈ V : Mᵀ = M}, A := {M ∈ V : Mᵀ = −M} e l'endomorfismo τ: V → V, τ(M) = Mᵀ."
text = "i) Si verifichi che S e A sono sottospazi vettoriali di V."
[item.data]
solution = """
O ∈ S and O ∈ A since Oᵀ = O = −O.
For M1, M2 ∈ S, λ, μ ∈ R: (λM1 + μM2)ᵀ = λM1ᵀ + μM2ᵀ = λM1 + μM2 ∈ S.
For M1, M2 ∈ A: (λM1 + μM2)ᵀ = λ(−M1) + μ(−M2) = −(λM1 + μM2) ∈ A."""

[[item]]
id = "P2606A-E2ii"
ref = "Esercizio 2 ii)"
section = "II"
points = 2.2
topic = "bases"
page = 3
task = "values"
text = "ii) Si calcolino dim S e dim A, esibendo una base di S e una base di A. (Give the dimensions; the bases are in the solution.)"
[item.data]
answers = [["dim S", 6], ["dim A", 3]]
why = "S: M = (a b c; b e f; c f i) = aE11 + b(E12 + E21) + c(E13 + E31) + eE22 + f(E23 + E32) + iE33: 6 independent generators. A: M = (0 b c; −b 0 f; −c −f 0) = b(E12 − E21) + c(E13 − E31) + f(E23 − E32): dim 3."

[[item]]
id = "P2606A-E2iii"
ref = "Esercizio 2 iii)"
section = "II"
points = 2.2
topic = "diagonalization"
page = 3
task = "open"
text = "iii) Si determinino gli autospazi di τ e si stabilisca se τ è diagonalizzabile."
[item.data]
solution = """
τ(M) = M ⇔ M ∈ S, so V_1 = S; τ(M) = −M ⇔ M ∈ A, so V_−1 = A. (τ² = id, so 1 and −1 are the only possible eigenvalues.)
dim V_1 + dim V_−1 = 6 + 3 = 9 = dim V: τ is diagonalisable (sum of the geometric multiplicities = dim V)."""

