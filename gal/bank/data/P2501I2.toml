[[item]]
id = "P2501I2-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
setup = "Si consideri la quadrica Q ⊆ R³ di equazione 3x² + 2y² + z² + 2√3 xz − 2x + 2√3 z + 2 = 0."
text = "a) Trovare una forma canonica metrica di Q."
[item.data]
solution = """
Quadratic part (3 0 √3; 0 2 0; √3 0 1): eigenvalues 4 (u = (√3/2, 0, 1/2)), 2 (e2), 0 (w = (1/2, 0, −√3/2)). The linear part (−2, 0, 2√3) has components 0 along u and −4 along w. In the coordinates (X, Y, Z) of {u, e2, w} and after translating the vertex to the origin: 4X² + 2Y² − 4Z = 0, i.e. Z = X² + Y²/2: an elliptic paraboloid."""


[[item]]
id = "P2501I2-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
text = "b) Trovare le equazioni cartesiane dei piani di simmetria di Q."
[item.data]
solution = """
The planes X = 0 and Y = 0 through the vertex (1/4, 0, −√3/4): √3x + z = 0 and y = 0."""


[[item]]
id = "P2501I2-E3c"
ref = "Esercizio 3 c)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
text = "c) Scrivere il cambio di coordinate che porta l'equazione di Q nella forma canonica metrica."
[item.data]
solution = """
x = (√3X + Z)/2 + 1/4,  y = Y,  z = (X − √3Z)/2 − √3/4 (a rotation by the orthogonal matrix with columns u, e2, w, then the translation to the vertex). Substituting gives 4X² + 2Y² − 4Z = 0."""
