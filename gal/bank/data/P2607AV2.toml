task = "open"
setup = "Per a, b ∈ R, sia M_a,b = (1 a; 0 b) ∈ M_R(2, 2) e si ponga S = {M_a,b : a, b ∈ R}."
text = "i) Si verifichi che M_a,b · M_c,d ∈ S per ogni a, b, c, d ∈ R, scrivendo esplicitamente M_a,b · M_c,d nella forma M_α,β."
[item.data]
solution = "(1 a; 0 b)(1 c; 0 d) = (1 c + ad; 0 bd) = M_α,β with α = c + ad, β = bd."

[[item]]
id = "P2607AV2-E3ii"
ref = "Esercizio 3 ii)"
section = "II"
points = 1.83
topic = "inverse"
page = 3
task = "values"
text = "ii) Si determini per quali a, b ∈ R la matrice M_a,b è invertibile. (Give the value of b for which it is NOT invertible; a plays no role.)"
[item.data]
answers = [["b such that M_a,b is NOT invertible", 0]]
why = "det M_a,b = 1·b − a·0 = b: invertible ⇔ b ≠ 0, for every a."

