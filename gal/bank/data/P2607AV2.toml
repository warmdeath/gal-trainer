[[item]]
id = "P2607AV2-E3iv"
ref = "Esercizio 3 iv)"
section = "II"
points = 1.87
topic = "systems"
page = 3
task = "open"
text = "iv) Si determini al variare dei parametri a, b, c, d ∈ R, quante matrici X ∈ M_R(2, 2) soddisfano l'equazione M_a,b · X = M_c,d."
[item.data]
solution = """
M_a,b·X = (x + ay  z + aw; by  bw) = (1 c; 0 d): the system x + ay = 1, z + aw = c, by = 0, bw = d.
• b ≠ 0: rank 4 → exactly one solution (X = M_a,b⁻¹ M_c,d).
• b = 0, d = 0: rank 2 = rank of the complete matrix → infinitely many (∞², y and w free).
• b = 0, d ≠ 0: 0 = d is impossible → no solutions."""
