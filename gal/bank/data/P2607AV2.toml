[[item]]
id = "P2607AV2-E1iii"
ref = "Esercizio 1 iii)"
section = "II"
points = 1.83
topic = "isometries"
page = 3
task = "open"
text = "iii) Scrivere una base ortonormale di R³ formata da autovettori di A e la matrice diagonale associata in tale base."
[item.data]
solution = """
A is symmetric: eigenspaces of distinct eigenvalues are orthogonal. V_0 = Span((0, 1, 1)), V_1 = Span((1, 0, 0)), V_2 = Span((0, 1, −1)).
B = {(0, 1/√2, 1/√2), (1, 0, 0), (0, 1/√2, −1/√2)} is an orthonormal basis of eigenvectors and
M^B_B(L_A) = D = diag(0, 1, 2) = PᵀAP, with P orthogonal (columns = vectors of B)."""

[[item]]
id = "P2607AV2-E1iv"
ref = "Esercizio 1 iv)"
section = "II"
points = 1.83
topic = "isometries"
page = 3
task = "open"
text = "iv) Determinare la forma canonica metrica della quadrica Q := {x ∈ R³ : xᵀAx = 0}."
[item.data]
solution = """
With x = Py: 0 = xᵀAx = yᵀDy = 0·y0² + y1² + 2y2², i.e. the metric canonical form y1² + 2y2² = 0
(only the points with y1 = y2 = 0: a line through the origin)."""

