[[item]]
id = "P2507A-E2c"
ref = "Esercizio 2 c)"
section = "II"
points = 2
topic = "isometries"
page = 3
task = "open"
text = "c) Stabilire se L è ortogonalmente diagonalizzabile ed in tal caso trovare una base ortonormale di R³ composta da autovettori di L."
[item.data]
solution = """
L(e2) = (L(0,1,1) − L(0,−1,1))/2 = (0, −1, 0), L(e3) = (L(0,1,1) + L(0,−1,1))/2 = (0, 0, 1): M^E_E(L) = diag(0, −1, 1), symmetric, so L is orthogonally diagonalisable and the canonical basis {e1, e2, e3} is already an orthonormal basis of eigenvectors (eigenvalues 0, −1, 1)."""


