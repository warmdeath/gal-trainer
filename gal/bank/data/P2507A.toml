[[item]]
id = "P2507A-E3c"
ref = "Esercizio 3 c)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
text = "c) Dopo aver classificato metricamente la quadrica Q(x1, x2, x3) = 1 trovare l'isometria che la porta nella forma canonica."
[item.data]
solution = """
Orthonormal eigenvectors: u1 = (1, −1, 0)/√2 (λ = 2), u2 = (0, 0, 1) (λ = 4), u3 = (1, 1, 0)/√2 (λ = 0). With x = Py, P = (u1 | u2 | u3) orthogonal: 2y1² + 4y2² = 1, i.e. y1²/(1/2) + y2²/(1/4) = 1: an elliptic cylinder (axis along u3 = Span((1, 1, 0)))."""
