[[item]]
id = "P2507A-E2a"
ref = "Esercizio 2 a)"
section = "II"
points = 2
topic = "linear_maps"
page = 3
task = "open"
setup = "Sia L: R³ → R³ l'endomorfismo con le proprietà L(1, 0, 0) = (0, 0, 0), L(0, 1, 1) = (0, −1, 1), L(0, −1, 1) = (0, 1, 1)."
text = "a) Dimostrare che L esiste ed è unico."
[item.data]
solution = """
(1, 0, 0), (0, 1, 1), (0, −1, 1) are independent (det = 2 ≠ 0), hence a basis of R³. A linear map is determined by arbitrary images of a basis, so L exists and is unique."""


