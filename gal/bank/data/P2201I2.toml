page = 3
task = "open"
text = "c) Trovare i valori di k per cui T_k è ortogonalmente diagonalizzabile."
[item.data]
solution = """
B is orthonormal, so T_k is orthogonally diagonalisable ⇔ M is symmetric ⇔ k = k − 2: impossible. No value of k."""


[[item]]
id = "P2201I2-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 3
topic = "isometries"
page = 4
task = "open"
setup = "Siano π = {x1 + x2 + x3 = 2} ⊂ R³ e P = (1, 2, 1)ᵀ."
text = "a) Dimostrare che Q = {x : d(x, π) = d(x, P)/√3} è la quadrica 2x1x2 + 2x1x3 + 2x2x3 − 2x1 − 2x3 − 2 = 0."
[item.data]
solution = """
d(x, π)² = (x1 + x2 + x3 − 2)²/3 and d(x, P)²/3 = ((x1 − 1)² + (x2 − 2)² + (x3 − 1)²)/3. Equating and expanding, the squares cancel: 2x1x2 + 2x1x3 + 2x2x3 − 2x1 − 2x3 − 2 = 0."""


[[item]]
id = "P2201I2-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 2
topic = "isometries"
page = 4
task = "open"
text = "b) Scrivere l'equazione canonica metrica della quadrica Q."
[item.data]
solution = """
A = (0 1 1; 1 0 1; 1 1 0): eigenvalues 2 ((1, 1, 1)) and −1 (double). Centre (0, 1, 0), where the constant is −2: 2X² − Y² − Z² = 2, i.e. X² − Y²/2 − Z²/2 = 1: a hyperboloid of two sheets."""


