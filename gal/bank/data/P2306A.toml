[[item]]
id = "P2306A-E3a"
ref = "Esercizio 3 a)"
section = "II"
points = 4
topic = "isometries"
page = 6
task = "open"
setup = "Data la quadrica Q ⊂ R³: x² − 2y² + z² + 2xy − 4xz + 2yz − 2x − 2y + 4z + 2 = 0."
text = "a) Classificare metricamente ed affinemente la quadrica Q."
[item.data]
solution = """
A = (1 1 −2; 1 −2 1; −2 1 1): eigenvalues 3 ((−1, 0, 1)), −3 ((1, −2, 1)), 0 ((1, 1, 1)); rank A = 2, rank of the 4 × 4 matrix = 3. Centres: the line (1, 0, 0) + t(1, 1, 1), where the constant becomes 1. Metric form 3X² − 3Y² + 1 = 0, i.e. Y²/(1/3) − X²/(1/3) = 1: a hyperbolic cylinder (equilateral section), also affinely."""


[[item]]
id = "P2306A-E3b"
ref = "Esercizio 3 b)"
section = "II"
points = 3
topic = "conics"
page = 6
task = "open"
text = "b) Classificare affinemente la conica data dall'intersezione di Q con il piano π: x − z = 0."
[item.data]
solution = """
On z = x: −2x² + 4xy − 2y² + 2x − 2y + 2 = 0 ⇔ (x − y)² − (x − y) − 1 = 0 ⇔ x − y = (1 ± √5)/2: two distinct parallel lines (in the plane π)."""
